name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep Leotheca crash-free. Please search [ROADMAP.md](https://github.com/LeonardSchwier/leotheca/blob/main/ROADMAP.md) first: the problem may already be tracked. Report anything exploitable privately, see [SECURITY.md](https://github.com/LeonardSchwier/leotheca/blob/main/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead. Include screenshots or logs when useful, and remove private note content first.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a folder with ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        [
          Linux AppImage,
          Linux Flatpak,
          Android,
          macOS,
          Windows,
          Built from source,
        ]
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build
      description: The version shown in the app, or the commit or `dev-build` date for a rolling build.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and version
      placeholder: Fedora 41 on Wayland, Android 15, ...
