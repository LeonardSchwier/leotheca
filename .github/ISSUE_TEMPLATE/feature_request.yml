name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Leotheca is offline and plain-file by design: no accounts, telemetry, hosted sync or app-initiated network calls (see [PHILOSOPHY.md](https://github.com/LeonardSchwier/leotheca/blob/main/PHILOSOPHY.md)). Requests that fit those rules and are not already in [ROADMAP.md](https://github.com/LeonardSchwier/leotheca/blob/main/ROADMAP.md) are welcome.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behaviour you would like, in your own words.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: platform
    attributes:
      label: Platforms affected
      multiple: true
      options: [Linux, Android, macOS, Windows]
