# Dependabot version updates, monthly and grouped.
#
# Agents, not the bot, land dependency changes: they port an update through the
# roadmap ledger (ROADMAP.md) and add the "Dependency-intake:" line that
# scripts/check-rules.mjs deps requires. Treat a Dependabot pull request as a
# suggestion to port, never as something to merge as it stands.
#
# Never let a bot change these (hence the ignore entries and the omitted
# directories below):
#   - the @leonardschwier/leoforma entry in package.json and package-lock.json.
#     It is installed from a release asset whose integrity hash is pinned by hand
#     (see "Install Leoforma from its release asset" in ROADMAP.md).
#   - flatpak/node-sources.json and flatpak/cargo-sources.json. They are
#     generated from the lockfiles (scripts/flatpakSources.test.js checks the npm one);
#     regenerate them as flatpak/README.md describes.
# Major updates are ignored everywhere in npm and cargo. A major bump of the
# Tauri or Capacitor stack changes native APIs and permissions, and the others
# (TypeScript, Preact signals, @types/node ahead of the Node 22 runtime) change
# the build or the API, so an agent ports each one as its own roadmap item.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "@leonardschwier/leoforma"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      e2e-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]
