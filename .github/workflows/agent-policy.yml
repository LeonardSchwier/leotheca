name: Agent policy

on:
  schedule:
    # Weekly audit (Monday 05:17 UTC): finished items must still carry hosted CI evidence.
    - cron: "17 5 * * 1"
  push:
    paths:
      - "CONSTITUTION.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "ROADMAP.md"
      - "documentation/REUSE_AGENT_ORCHESTRATION.md"
      - "skills/**"
      - "scripts/agent_ledger.py"
      - "scripts/test_agent_ledger.py"
      - "scripts/check_roadmap_format.py"
      - "scripts/test_check_roadmap_format.py"
      - "scripts/check_ledger_evidence.py"
      - "scripts/test_check_ledger_evidence.py"
      - ".github/workflows/agent-policy.yml"
      - "master-spec.md"
      - "spec/master/**"
      - "scripts/check_master_spec.py"
      - "scripts/test_check_master_spec.py"
      - "src/**"
      - "src-tauri/**"
      - "android/**"
      - "capacitor.config.ts"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "VERSION"
      - "public/**"
      - "extensions/**"
      - "flatpak/**"
      - "packaging/**"
      - "snap/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "CONSTITUTION.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "ROADMAP.md"
      - "documentation/REUSE_AGENT_ORCHESTRATION.md"
      - "skills/**"
      - "scripts/agent_ledger.py"
      - "scripts/test_agent_ledger.py"
      - "scripts/check_roadmap_format.py"
      - "scripts/test_check_roadmap_format.py"
      - "scripts/check_ledger_evidence.py"
      - "scripts/test_check_ledger_evidence.py"
      - ".github/workflows/agent-policy.yml"
      - "master-spec.md"
      - "spec/master/**"
      - "scripts/check_master_spec.py"
      - "scripts/test_check_master_spec.py"
      - "src/**"
      - "src-tauri/**"
      - "android/**"
      - "capacitor.config.ts"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "VERSION"
      - "public/**"
      - "extensions/**"
      - "flatpak/**"
      - "packaging/**"
      - "snap/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  ledger:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # check_roadmap_format.py diffs ROADMAP.md against a base commit
          # (git show <base>:ROADMAP.md); a shallow clone would not contain
          # that commit's object.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test ownership, expiry, and competing pushes
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate the repository ledger
        run: python3 scripts/agent_ledger.py --root . list > /dev/null
      - name: Determine base ref for the roadmap format check
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ref="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] \
               && [ -n "${{ github.event.before }}" ] \
               && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            ref="${{ github.event.before }}"
          else
            ref=""
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Check new roadmap entries follow the format guide
        run: |
          if [ -n "${{ steps.base.outputs.ref }}" ]; then
            python3 scripts/check_roadmap_format.py --root . --base "${{ steps.base.outputs.ref }}"
          else
            echo "No usable base commit for this event (new branch or history rewrite); running the structural check only."
            python3 scripts/check_roadmap_format.py --root .
          fi
      - name: Check finished items carry hosted CI evidence
        run: |
          if [ -n "${{ steps.base.outputs.ref }}" ]; then
            python3 scripts/check_ledger_evidence.py --root . --base "${{ steps.base.outputs.ref }}"
          else
            python3 scripts/check_ledger_evidence.py --root . --since 2026-11-08
          fi
  # ​
  master-spec:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test the master specification checker
        run: python3 -m unittest scripts.test_check_master_spec -v
      - name: Determine base commit
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ref="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] \
               && [ -n "${{ github.event.before }}" ] \
               && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            ref="${{ github.event.before }}"
          else
            ref=""
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Application changes must update master-spec.md
        run: |
          if [ -n "${{ steps.base.outputs.ref }}" ]; then
            python3 scripts/check_master_spec.py --root . --base "${{ steps.base.outputs.ref }}" --head HEAD
          else
            echo "No usable base commit; running the structure check only."
            python3 scripts/check_master_spec.py --root .
          fi

  ledger-audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate the repository ledger
        run: python3 scripts/agent_ledger.py --root . list > /dev/null
      - name: Audit finished items for hosted CI evidence
        run: python3 scripts/check_ledger_evidence.py --root . --since 2026-11-08
