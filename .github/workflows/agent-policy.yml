name: Agent policy

on:
  push:
    paths:
      - "CONSTITUTION.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "ROADMAP.md"
      - "documentation/REUSE_AGENT_ORCHESTRATION.md"
      - "skills/**"
      - "scripts/agent_ledger.py"
      - "scripts/test_agent_ledger.py"
      - ".github/workflows/agent-policy.yml"
  pull_request:
    paths:
      - "CONSTITUTION.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "ROADMAP.md"
      - "documentation/REUSE_AGENT_ORCHESTRATION.md"
      - "skills/**"
      - "scripts/agent_ledger.py"
      - "scripts/test_agent_ledger.py"
      - ".github/workflows/agent-policy.yml"

permissions:
  contents: read

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test ownership, expiry, and competing pushes
        run: python3 -m unittest discover -s scripts -p 'test_agent_ledger.py' -v
      - name: Validate the repository ledger
        run: python3 scripts/agent_ledger.py --root . list > /dev/null
