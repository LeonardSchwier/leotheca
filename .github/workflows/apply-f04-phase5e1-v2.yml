              ### Heading-owned block IDs

              `markdown/headings.ts` is the only parser for heading structure and now also owns an optional trailing explicit `^id` marker on ATX and setext headings. The marker is kept out of the heading's visible text and content range. `markdown/blocks.ts` merges those canonical heading records into the shared block model so block resolution, duplicate detection, Copy block link, and Preview anchoring do not maintain a second heading parser. The persisted link-index cache version is bumped whenever this block-record shape changes so an old cache cannot hide heading IDs until a later file edit.

              ## Build and distribution architecture
