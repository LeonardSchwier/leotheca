name: Apply F04 Phase 5e1 v3

on:
  push:
    branches: [automation/apply-f04-phase5e1-v3-2059]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Build and test complete candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/f04-phase5e1-heading-block-ids
          git checkout -B work origin/agent/f04-phase5e1-heading-block-ids
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path); text = p.read_text(encoding="utf-8")
              n = text.count(old)
              if n != count: raise SystemExit(f"{path}: expected {count} matches, found {n}: {old[:90]!r}")
              p.write_text(text.replace(old, new, count), encoding="utf-8")

          # Canonical heading scanner owns heading block IDs.
          replace("src/markdown/headings.ts", "  occurrence: number;\n  level: 1 | 2 | 3 | 4 | 5 | 6;", "  occurrence: number;\n  /** Optional explicit block ID attached to this heading. */\n  blockId?: { id: string; idFrom: number; idTo: number };\n  level: 1 | 2 | 3 | 4 | 5 | 6;")
          replace("src/markdown/headings.ts", "const CLOSING_HASH_RE = /[ \\t]+#+$/;", "const CLOSING_HASH_RE = /[ \\t]+#+$/;\nconst HEADING_BLOCK_ID_RE = /[ \\t]+\\^([A-Za-z0-9][A-Za-z0-9-]{0,63})[ \\t]*$/;")
          replace("src/markdown/headings.ts", "  line: number;\n  column: number;\n}\n\nfunction tryParseAtx", "  line: number;\n  column: number;\n  blockId?: { id: string; idFrom: number; idTo: number };\n}\n\nfunction extractHeadingBlockId(rawText: string, absoluteContentStart: number): { rawText: string; contentTo: number; blockId?: { id: string; idFrom: number; idTo: number } } {\n  const match = HEADING_BLOCK_ID_RE.exec(rawText);\n  if (!match) return { rawText, contentTo: absoluteContentStart + rawText.length };\n  const id = match[1];\n  const idFrom = absoluteContentStart + match.index + match[0].indexOf(\"^\");\n  return { rawText: rawText.slice(0, match.index), contentTo: absoluteContentStart + match.index, blockId: { id, idFrom, idTo: idFrom + 1 + id.length } };\n}\n\nfunction tryParseAtx")
          old_atx = '''  let raw = line.text.slice(contentStart, contentEnd);
  const closing = CLOSING_HASH_RE.exec(raw);
  if (closing) {
    contentEnd -= closing[0].length;
    raw = raw.slice(0, raw.length - closing[0].length);
  }
  return {
    level: hashes.length as RawHeading["level"],
    rawText: raw,
    sourceFrom: line.start,
    sourceTo: line.end,
    contentFrom: line.start + contentStart,
    contentTo: line.start + contentEnd,
    line: line.lineNumber,
    column: 1,
  };'''
          new_atx = '''  let raw = line.text.slice(contentStart, contentEnd);
  const closing = CLOSING_HASH_RE.exec(raw);
  if (closing) {
    contentEnd -= closing[0].length;
    raw = raw.slice(0, raw.length - closing[0].length);
  }
  const parsedBlockId = extractHeadingBlockId(raw, line.start + contentStart);
  raw = parsedBlockId.rawText;
  contentEnd = parsedBlockId.contentTo - line.start;
  return {
    level: hashes.length as RawHeading["level"],
    rawText: raw,
    sourceFrom: line.start,
    sourceTo: line.end,
    contentFrom: line.start + contentStart,
    contentTo: line.start + contentEnd,
    line: line.lineNumber,
    column: 1,
    blockId: parsedBlockId.blockId,
  };'''
          replace("src/markdown/headings.ts", old_atx, new_atx)
          old_setext = '''        consumedLines.add(i - 1);
        consumedLines.add(i);
        raw.push({
          level: setextLevel,
          rawText: textLine.text.slice(contentStart, contentEnd),
          sourceFrom: textLine.start,
          sourceTo: line.end,
          contentFrom: textLine.start + contentStart,
          contentTo: textLine.start + contentEnd,
          line: textLine.lineNumber,
          column: 1,
        });'''
          new_setext = '''        const parsedBlockId = extractHeadingBlockId(textLine.text.slice(contentStart, contentEnd), textLine.start + contentStart);
        contentEnd = parsedBlockId.contentTo - textLine.start;
        consumedLines.add(i - 1);
        consumedLines.add(i);
        raw.push({
          level: setextLevel,
          rawText: parsedBlockId.rawText,
          sourceFrom: textLine.start,
          sourceTo: line.end,
          contentFrom: textLine.start + contentStart,
          contentTo: textLine.start + contentEnd,
          line: textLine.lineNumber,
          column: 1,
          blockId: parsedBlockId.blockId,
        });'''
          replace("src/markdown/headings.ts", old_setext, new_setext)
          replace("src/markdown/headings.ts", "      key,\n      occurrence,\n      level: h.level,", "      key,\n      occurrence,\n      blockId: h.blockId,\n      level: h.level,")

          # Shared block model imports canonical headings, never reparses them.
          replace("src/markdown/blocks.ts", "/**\n * F04 Phase 3a/3b/3d/3e's block-reference scanner", "import { scanHeadings } from \"./headings\";\n\n/**\n * F04 Phase 3a/3b/3d/3e's block-reference scanner")
          replace("src/markdown/blocks.ts", '  kind: "paragraph" | "list-item" | "blockquote" | "fenced-code";', '  kind: "paragraph" | "list-item" | "blockquote" | "fenced-code" | "heading";')
          replace("src/markdown/blocks.ts", "  flushPendingFencedCode();\n  flushParagraph();\n  flushOpenBlock();\n\n  return blocks;", "  flushPendingFencedCode();\n  flushParagraph();\n  flushOpenBlock();\n\n  for (const heading of scanHeadings(content)) {\n    blocks.push({ kind: \"heading\", sourceFrom: heading.sourceFrom, sourceTo: heading.sourceTo, contentFrom: heading.contentFrom, contentTo: heading.contentTo, line: heading.line, column: heading.column, marker: heading.blockId ? { id: heading.blockId.id, idFrom: heading.blockId.idFrom, idTo: heading.blockId.idTo } : undefined });\n  }\n  blocks.sort((a, b) => a.sourceFrom - b.sourceFrom);\n\n  return blocks;")
          replace("src/markdown/blocks.test.ts", '  it("returns undefined for an offset inside a heading or a blank line between blocks", () => {\n    const source = "# A heading\\n\\nA paragraph.";\n    expect(findBlockAtOffset(source, source.indexOf("heading"))).toBeUndefined();\n    expect(findBlockAtOffset(source, source.indexOf("\\n\\n") + 1)).toBeUndefined();\n  });', '  it("finds a heading block and still returns undefined for a blank line between blocks", () => {\n    const source = "# A heading\\n\\nA paragraph.";\n    expect(findBlockAtOffset(source, source.indexOf("heading"))?.kind).toBe("heading");\n    expect(findBlockAtOffset(source, source.indexOf("\\n\\n") + 1)).toBeUndefined();\n  });')

          # Persisted index shape changes must invalidate old caches.
          replace("src/linking/store.ts", '      record.kind === "blockquote" ||\n      record.kind === "fenced-code") &&', '      record.kind === "blockquote" ||\n      record.kind === "fenced-code" ||\n      record.kind === "heading") &&')
          replace("src/linking/store.ts", "const LINK_INDEX_CACHE_VERSION = 7;", "const LINK_INDEX_CACHE_VERSION = 8;")
          p = Path("src/linking/store.ts"); t = p.read_text(encoding="utf-8")
          marker = '  const isFiniteNumber = (v: unknown): v is number =>\n    typeof v === "number" && Number.isFinite(v);\n  return (\n    typeof record.key === "string" &&'
          replacement = '  const isFiniteNumber = (v: unknown): v is number =>\n    typeof v === "number" && Number.isFinite(v);\n  const blockId = record.blockId;\n  const validBlockId = blockId === undefined || (typeof blockId === "object" && blockId !== null && typeof (blockId as Record<string, unknown>).id === "string" && isFiniteNumber((blockId as Record<string, unknown>).idFrom) && isFiniteNumber((blockId as Record<string, unknown>).idTo));\n  return (\n    validBlockId &&\n    typeof record.key === "string" &&'
          pos = t.find("function isValidHeadingRecord")
          if pos < 0: raise SystemExit("missing isValidHeadingRecord")
          tail = t[pos:]
          if tail.count(marker) < 1: raise SystemExit("heading validator shape drifted")
          tail = tail.replace(marker, replacement, 1); p.write_text(t[:pos] + tail, encoding="utf-8")
          p = Path("src/linking/store.test.ts"); t = p.read_text(encoding="utf-8")
          if t.count("version: 7,") != 3: raise SystemExit(f"expected 3 version 7 fixtures, found {t.count('version: 7,')}")
          t = t.replace("version: 7,", "version: 8,")
          t = t.replace('if (path.endsWith("Alpha.md")) return "A paragraph with an id. ^my-block";', 'if (path.endsWith("Alpha.md")) return "# Section ^heading-id\\n\\nA paragraph with an id. ^my-block";', 1)
          t = t.replace('expect(alphaBlocks?.map((b) => b.id)).toEqual(["my-block"]);', 'expect(alphaBlocks?.map((b) => b.id)).toEqual(["heading-id", "my-block"]);', 1)
          p.write_text(t, encoding="utf-8")

          # Preview preserves heading suffixes and anchors the heading DOM node.
          replace("src/editor/MarkdownPreview.tsx", "    result += source.slice(cursor, block.contentTo);\n    cursor = block.sourceTo;", "    result += source.slice(cursor, block.contentTo);\n    cursor = block.kind === \"heading\" ? block.marker!.idTo : block.sourceTo;")
          replace("src/editor/MarkdownPreview.tsx", '              kind === "list-item" ? "li" : kind === "blockquote" ? "blockquote" : "p",', '              kind === "list-item" ? "li" : kind === "blockquote" ? "blockquote" : kind === "heading" ? "h1,h2,h3,h4,h5,h6" : "p",')

          Path("src/markdown/headingBlockIds.test.ts").write_text('''import { describe, expect, it } from "vitest";\nimport { resolveBlockLinkAtCursor } from "../editor/blockLinkActions";\nimport { findBlockAtOffset, scanBlockIds } from "./blocks";\nimport { scanHeadings } from "./headings";\n\ndescribe("heading block IDs", () => {\n  it("parses ATX markers without exposing them as heading text", () => { const source = "## Architecture boundary ^architecture-boundary"; const [h] = scanHeadings(source); expect(h.displayText).toBe("Architecture boundary"); expect(h.blockId?.id).toBe("architecture-boundary"); expect(source.slice(h.contentFrom,h.contentTo)).toBe("Architecture boundary"); });\n  it("recognizes a marker before optional closing hashes", () => { const [h] = scanHeadings("### Shipping ^release ##"); expect(h.displayText).toBe("Shipping"); expect(h.blockId?.id).toBe("release"); });\n  it("parses setext markers while preserving the underline", () => { const source="Architecture ^arch\\n============\\nBody"; const [h]=scanHeadings(source); expect(h.displayText).toBe("Architecture"); expect(h.blockId?.id).toBe("arch"); expect(source.slice(h.sourceFrom,h.sourceTo)).toContain("============"); });\n  it("leaves malformed markers visible", () => { const [h]=scanHeadings("## Heading ^bad_id"); expect(h.blockId).toBeUndefined(); expect(h.displayText).toBe("Heading ^bad_id"); });\n  it("shares one case-insensitive duplicate namespace", () => { const b=scanBlockIds("## Heading ^Shared\\n\\nParagraph. ^shared"); expect(b.map(x=>x.kind)).toEqual(["heading","paragraph"]); expect(b.map(x=>x.occurrence)).toEqual([1,2]); });\n  it("finds markerless headings at the cursor", () => { const s="# Markerless heading\\n\\nBody."; expect(findBlockAtOffset(s,s.indexOf("heading"))?.kind).toBe("heading"); });\n  it("lets Copy block link create a marker for a markerless heading", () => { const s="## Heading\\n\\nBody."; const h=scanHeadings(s)[0]; const r=resolveBlockLinkAtCursor(s,s.indexOf("Heading")+2)!; expect(r.insertion?.from).toBe(h.contentTo); expect(r.insertion?.text).toMatch(/^ \\^b-[a-f0-9]{8}$/); expect(r.linkText).toBe(`[[#^${r.insertion!.text.slice(2)}]]`); });\n});\n''', encoding="utf-8")
          Path("src/editor/MarkdownPreview.headingBlocks.test.tsx").write_text('''/** @vitest-environment jsdom */\nimport { cleanup, render } from "@testing-library/preact";\nimport { afterEach, describe, expect, it, vi } from "vitest";\nvi.mock("../workspace/tauriBridge", () => ({ fileSrc: vi.fn(), readTextFile: vi.fn() }));\nvi.mock("../settings/store", async () => { const { signal } = await import("@preact/signals"); return { workspacePath: signal<string | null>(null) }; });\nimport { MarkdownPreview } from "./MarkdownPreview";\nafterEach(cleanup);\ndescribe("MarkdownPreview heading block IDs", () => {\n  it("hides and anchors an ATX marker", () => { const {container}=render(<MarkdownPreview source="## Architecture ^arch" notePath="/vault/note.md" />); const h=container.querySelector("h2"); expect(h?.textContent).toBe("Architecture"); expect(h?.id).toBe("lt-block-arch"); expect(h?.getAttribute("data-lt-block-id")).toBe("arch"); });\n  it("keeps setext rendering intact", () => { const {container}=render(<MarkdownPreview source={"Architecture ^arch\\n============\\nBody"} notePath="/vault/note.md" />); const h=container.querySelector("h1"); expect(h?.textContent).toBe("Architecture"); expect(h?.id).toBe("lt-block-arch"); });\n});\n''', encoding="utf-8")

          replace("CHANGELOG.md", "## Unreleased\n", "## Unreleased\n\n- Block references now support headings. A trailing `^id` on an ATX or setext heading stays hidden in Preview, shares the normal block-ID namespace, and works with Copy block link.\n")
          replace("documentation/ARCHITECTURE.md", "\n## Build and distribution architecture\n", "\n### Heading-owned block IDs\n\n`markdown/headings.ts` remains the only heading parser and owns optional trailing `^id` markers. `markdown/blocks.ts` merges those canonical heading records into the shared block model for resolution, duplicate detection, Copy block link, indexing, and Preview anchoring. The persisted index cache version changes with this record shape so stale caches cannot hide heading IDs.\n\n## Build and distribution architecture\n")
          p=Path("ROADMAP.md"); lines=p.read_text(encoding="utf-8").splitlines(); m=[i for i,x in enumerate(lines) if x.startswith("- 🚧 **F04 Phase 5e1:")]
          if len(m)!=1: raise SystemExit(f"expected one 5e1 claim, found {len(m)}")
          lines.pop(m[0]); implemented='- ✅ **F04 Phase 5e1: heading block-ID eligibility and Preview heading anchors** (claim: ChatGPT-GPT-5.6-Sol-manual-20260903T2052Z, branch: agent/f04-phase5e1-heading-block-ids, spec: `spec/f04-heading-block-links-embeds.md`, sections 7.1-7.4 and 21 Phase 5): ATX and setext headings can own trailing explicit `^id` markers through the canonical heading scanner. Markers stay out of visible heading text; headings join the same case-insensitive block-ID namespace as other blocks; Copy block link can create or reuse a heading ID; Preview attaches deterministic block anchors to rendered headings; and the persisted link-index cache advances to version 8 so old caches cannot hide heading IDs. Focused tests cover ATX, closing hashes, setext headings, malformed markers, duplicates across block kinds, markerless heading lookup, Copy block link insertion, Preview anchoring, and indexed heading IDs. Phase 5e2 remains open for the Preview hover/focus/long-press copy affordance, and Phase 5e3 remains open for the separate Create block link action.'
          i=lines.index("## Implemented"); lines[i+1:i+1]=["",implemented]; p.write_text("\n".join(lines)+"\n",encoding="utf-8")
          PY
          npm ci
          npx tsc --noEmit
          npx vitest run src/markdown/headings.test.ts src/markdown/blocks.test.ts src/markdown/headingBlockIds.test.ts src/editor/MarkdownPreview.headingBlocks.test.tsx src/editor/blockLinkActions.test.ts src/linking/store.test.ts
          git config user.name Leonardschwier
          git config user.email github@leonardschwier.de
          git add src CHANGELOG.md documentation/ARCHITECTURE.md ROADMAP.md
          git commit -m "Implement F04 Phase 5e1 heading block IDs"
          git push origin HEAD:agent/f04-phase5e1-heading-block-ids
