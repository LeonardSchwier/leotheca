name: Dependency audit

# Fails on any known high or critical vulnerability in the production
# npm dependencies (npm-audit job) and on any known RustSec vulnerability in
# src-tauri/Cargo.lock (cargo-audit job). Both read the lockfile only, so no
# install or build is needed. cargo-audit reports unmaintained, unsound and
# yanked crates as warnings and does not fail on them; read them in the log.
# New advisories appear without any change of ours, so it also runs weekly.
# It is deliberately not a required merge check: an advisory that lands today
# must not block an unrelated pull request. The weekly run turns red instead.

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/audit.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "src-tauri/Cargo.lock"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  cargo-audit:
    runs-on: ubuntu-latest
    env:
      CARGO_AUDIT_VERSION: 0.22.2
      # SHA-256 of the musl release asset, computed from a download on
      # 2026-11-07 (the project publishes no checksum file). Bump both together.
      CARGO_AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit (pinned release binary, checksum verified)
        run: |
          asset="cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}.tgz"
          curl -fsSL -o "$RUNNER_TEMP/$asset" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/$asset"
          echo "$CARGO_AUDIT_SHA256  $RUNNER_TEMP/$asset" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/${asset%.tgz}/cargo-audit" "$RUNNER_TEMP/cargo-audit"
      - name: Audit src-tauri/Cargo.lock
        working-directory: src-tauri
        run: '"$RUNNER_TEMP/cargo-audit" audit'
