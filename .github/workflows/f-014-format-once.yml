name: F-014 format once

on:
  push:
    branches:
      - agent/f-014-validation-gate

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml
      - name: Commit formatter output when needed
        run: |
          if git diff --quiet -- src-tauri/src/commands.rs; then
            exit 0
          fi
          git config user.name "Leotheca CI"
          git config user.email "actions@users.noreply.github.com"
          git add src-tauri/src/commands.rs
          git commit -m "Format Rust source for validation"
          git push origin HEAD:agent/f-014-validation-gate
