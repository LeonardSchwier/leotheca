name: F014 Finalize

on:
  push:
    branches: ["agent/f-014-validation-gate"]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/f-014-validation-gate
      - name: Update repository records
        run: python3 .github/finalize_f014.py
      - name: Commit repository records
        run: |
          git config user.name "ChatGPT automation"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/f014-finalize.yml .github/finalize_f014.py
          git add ROADMAP.md
          git commit -m "Finalize F-014 validation gate"
          git push origin HEAD:agent/f-014-validation-gate
