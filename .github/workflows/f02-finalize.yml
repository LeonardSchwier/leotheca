name: Finalize F02 metadata

on:
  push:
    branches:
      - agent/f02-phase2-filter-toggle
    paths:
      - .github/workflows/f02-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified F02 metadata to current branch
        shell: bash
        run: |
          set -euo pipefail
          source=93c54ea6fdf0a2b9136919c1ee25a27480da3672
          git show "$source:ROADMAP.md" > /tmp/f02-roadmap.md
          git show "$source:CHANGELOG.md" > /tmp/f02-changelog.md
          git show "$source:documentation/ARCHITECTURE.md" > /tmp/f02-architecture.md
          python3 - <<'PY'
          from pathlib import Path

          def unique_line(text: str, prefix: str) -> str:
              matches = [line for line in text.splitlines(keepends=True) if line.startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f"Expected one line starting {prefix!r}, found {len(matches)}")
              return matches[0]

          def replace_unique(text: str, prefix: str, replacement: str) -> str:
              matches = [line for line in text.splitlines(keepends=True) if line.startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f"Expected one current line starting {prefix!r}, found {len(matches)}")
              return text.replace(matches[0], replacement, 1)

          roadmap_path = Path("ROADMAP.md")
          roadmap = roadmap_path.read_text()
          source_roadmap = Path("/tmp/f02-roadmap.md").read_text()
          completed = unique_line(source_roadmap, "- ✅ **F02 Phase 2:")
          phase1 = unique_line(source_roadmap, "- ✅ **F02 Phase 1:")
          phase3 = unique_line(source_roadmap, "- ⬜ **F02 Phase 3:")
          if "- ✅ **F02 Phase 2:" in roadmap:
              raise SystemExit("F02 Phase 2 is already marked implemented")
          roadmap = replace_unique(roadmap, "- ✅ **F02 Phase 1:", phase1)
          roadmap = replace_unique(roadmap, "- 🚧 **F02 Phase 2:", phase3)
          marker = "## Implemented\n\n"
          if roadmap.count(marker) != 1:
              raise SystemExit("Implemented section marker is not unique")
          roadmap = roadmap.replace(marker, marker + completed, 1)
          roadmap_path.write_text(roadmap)

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text()
          source_changelog = Path("/tmp/f02-changelog.md").read_text()
          hub_phase1 = unique_line(source_changelog, "- A new Task Hub button")
          hub_phase2 = unique_line(source_changelog, "- The Task Hub's checkbox")
          changelog = replace_unique(changelog, "- A new Task Hub button", hub_phase1)
          if "- The Task Hub's checkbox" in changelog:
              raise SystemExit("F02 Phase 2 changelog line already exists")
          changelog = changelog.replace(hub_phase1, hub_phase1 + hub_phase2, 1)
          changelog_path.write_text(changelog)

          architecture_path = Path("documentation/ARCHITECTURE.md")
          architecture = architecture_path.read_text()
          source_architecture = Path("/tmp/f02-architecture.md").read_text()
          tasks_row = unique_line(source_architecture, "| `tasks/` |")
          architecture = replace_unique(architecture, "| `tasks/` |", tasks_row)
          architecture_path.write_text(architecture)
          PY
          git rm .github/workflows/f02-finalize.yml
          git diff --check
          git config user.name Leonardschwier
          git config user.email github@leonardschwier.de
          git add ROADMAP.md CHANGELOG.md documentation/ARCHITECTURE.md
          git commit -m "Finalize F02 Phase 2 metadata"
          git push origin HEAD:agent/f02-phase2-filter-toggle
