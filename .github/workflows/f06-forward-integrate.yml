name: Forward integrate F06 Phase 3

on:
  push:
    branches:
      - agent/f06-phase3-link-actions
    paths:
      - .github/workflows/f06-forward-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Leonardschwier
          git config user.email github@leonardschwier.de
          git fetch origin main
          source_head=$(git rev-parse HEAD)
          git show "$source_head:ROADMAP.md" > /tmp/f06-roadmap.md
          git show "$source_head:CHANGELOG.md" > /tmp/f06-changelog.md
          git show "$source_head:documentation/ARCHITECTURE.md" > /tmp/f06-architecture.md
          if ! git merge --no-ff --no-commit origin/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            expected=(CHANGELOG.md ROADMAP.md documentation/ARCHITECTURE.md)
            if [[ "${conflicts[*]}" != "${expected[*]}" ]]; then
              printf 'Unexpected conflicts: %s\n' "${conflicts[*]}" >&2
              exit 1
            fi
            git checkout --theirs -- CHANGELOG.md ROADMAP.md documentation/ARCHITECTURE.md
            git add CHANGELOG.md ROADMAP.md documentation/ARCHITECTURE.md
            python3 - <<'PY'
          from pathlib import Path

          def unique_line(text: str, prefix: str) -> str:
              lines = [line for line in text.splitlines(keepends=True) if line.startswith(prefix)]
              if len(lines) != 1:
                  raise SystemExit(f"Expected one line starting {prefix!r}, found {len(lines)}")
              return lines[0]

          roadmap_path = Path("ROADMAP.md")
          roadmap = roadmap_path.read_text()
          source_roadmap = Path("/tmp/f06-roadmap.md").read_text()
          completed = unique_line(source_roadmap, "- ✅ **F06 Phase 3:")
          claim = unique_line(roadmap, "- 🚧 **F06 Phase 3:")
          roadmap = roadmap.replace(claim, "", 1)
          marker = "## Implemented\n\n"
          if roadmap.count(marker) != 1 or "- ✅ **F06 Phase 3:" in roadmap:
              raise SystemExit("Unexpected F06 roadmap state")
          roadmap = roadmap.replace(marker, marker + completed, 1)
          roadmap_path.write_text(roadmap)

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text()
          source_changelog = Path("/tmp/f06-changelog.md").read_text()
          bullet = unique_line(source_changelog, "- The Outline panel and the heading breadcrumb trail now each offer Copy link and Insert link")
          if bullet.strip() in changelog:
              raise SystemExit("F06 changelog line already exists")
          end_marker = "\nEntries will accumulate here from the first tagged release onward."
          if changelog.count(end_marker) != 1:
              raise SystemExit("Changelog end marker is not unique")
          changelog = changelog.replace(end_marker, "\n" + bullet.rstrip("\n") + "\n" + end_marker, 1)
          changelog_path.write_text(changelog)

          architecture_path = Path("documentation/ARCHITECTURE.md")
          architecture = architecture_path.read_text()
          source_architecture = Path("/tmp/f06-architecture.md").read_text()
          source_outline = unique_line(source_architecture, "| `outline/` |")
          phase3_marker = " Phase 3 (spec section 9) added"
          if phase3_marker not in source_outline:
              raise SystemExit("F06 Phase 3 outline documentation missing in source")
          phase3_tail = phase3_marker + source_outline.split(phase3_marker, 1)[1]
          if not phase3_tail.endswith("|\n"):
              raise SystemExit("Unexpected outline row shape")
          phase3_tail = phase3_tail[:-2].rstrip()

          editor = unique_line(architecture, "| `editor/` |")
          editor_old = "after `[[Note#`/`[[#` is typed)"
          editor_new = "after `[[Note#`/`[[#` is typed; F06 Phase 3 adds an `insertRequest` prop, mirroring `reveal` but performing a normal, undo-tracked edit for the insert-heading-link action)"
          if editor_old not in editor or "F06 Phase 3 adds an `insertRequest` prop" in editor:
              raise SystemExit("Unexpected editor architecture row")
          architecture = architecture.replace(editor, editor.replace(editor_old, editor_new, 1), 1)

          linking = unique_line(architecture, "| `linking/` |")
          linking_anchor = " Note that `wikiResolver.ts`'s note-target resolution"
          if linking_anchor not in linking or "`serializeWikiLink` (F06 Phase 3)" in linking:
              raise SystemExit("Unexpected linking architecture row")
          linking_add = " `wikiSyntax.ts` also exports `serializeWikiLink` (F06 Phase 3), the one allowed way to build fresh `[[Note#Heading]]`/`[[#Heading]]` link text for `outline/headingLinkActions.ts`'s copy/insert actions rather than hand-concatenating it."
          architecture = architecture.replace(linking, linking.replace(linking_anchor, linking_add + linking_anchor, 1), 1)

          outline = unique_line(architecture, "| `outline/` |")
          if "Phase 3 (spec section 9) added" in outline or not outline.endswith("|\n"):
              raise SystemExit("Unexpected outline architecture row")
          outline_new = outline[:-2].rstrip() + phase3_tail + " |\n"
          architecture = architecture.replace(outline, outline_new, 1)
          architecture_path.write_text(architecture)
          PY
          fi
          git rm .github/workflows/f06-forward-integrate.yml
          git add CHANGELOG.md ROADMAP.md documentation/ARCHITECTURE.md src
          git diff --check
          if git grep -n $'\342\200\224' -- CHANGELOG.md ROADMAP.md documentation/ARCHITECTURE.md; then
            echo "Checked-in metadata contains an em dash" >&2
            exit 1
          fi
          git commit -m "Forward integrate F06 Phase 3 with current main"
          git push origin HEAD:agent/f06-phase3-link-actions
