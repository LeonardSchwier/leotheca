name: Capture final F09 TypeScript diagnostics

on:
  push:
    branches:
      - agent/f09-phase1-collections
    paths:
      - .github/workflows/f09-capture-tsc3.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Capture exact compiler diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Leonardschwier
          git config user.email github@leonardschwier.de
          npm ci
          set +e
          npx tsc -p tsconfig.json --noEmit > .f09-tsc3.txt 2>&1
          status=$?
          set -e
          printf '\nexit=%s\n' "$status" >> .f09-tsc3.txt
          git add .f09-tsc3.txt
          git rm .github/workflows/f09-capture-tsc3.yml
          git commit -m "Capture final F09 TypeScript diagnostics"
          git push origin HEAD:agent/f09-phase1-collections
