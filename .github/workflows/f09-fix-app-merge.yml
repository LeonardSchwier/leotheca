name: Repair remaining F09 App merge boundaries

on:
  push:
    branches:
      - agent/f09-phase1-collections
    paths:
      - .github/workflows/f09-fix-app-merge.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore collection and diagnostics boundaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Leonardschwier
          git config user.email github@leonardschwier.de
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/app/App.tsx")
          text = path.read_text()

          broken_handler = '''  const openCollectionsPanel = () => {\n    toggleSidebarPanel(collectionsOpen);\n    if (collectionsOpen.value && rootPath) {\n  const openDiagnosticsPanel = () => {'''
          fixed_handler = '''  const openCollectionsPanel = () => {\n    toggleSidebarPanel(collectionsOpen);\n    if (collectionsOpen.value && rootPath) {\n      void rebuildLinkIndex(\n        rootPath,\n        workspaceSettings.value.frontmatterAliasesEnabled,\n        workspaceSettings.value.tagsEnabled,\n      );\n      void loadCollections(rootPath);\n    }\n  };\n\n  const openDiagnosticsPanel = () => {'''
          if text.count(broken_handler) != 1:
              raise SystemExit("expected one merged panel-handler boundary")
          text = text.replace(broken_handler, fixed_handler)

          misplaced_load = '''      );\n      void loadCollections(rootPath);\n    }\n  };\n\n  const commands ='''
          correct_diagnostics = '''      );\n    }\n  };\n\n  const commands ='''
          if text.count(misplaced_load) != 1:
              raise SystemExit("expected one misplaced collections load in diagnostics handler")
          text = text.replace(misplaced_load, correct_diagnostics)

          broken_commands = '''        run: openCollectionsPanel,\n        id: "toggle-diagnostics",'''
          fixed_commands = '''        run: openCollectionsPanel,\n      },\n      {\n        id: "toggle-diagnostics",'''
          if text.count(broken_commands) != 1:
              raise SystemExit("expected one merged command boundary")
          text = text.replace(broken_commands, fixed_commands)

          path.write_text(text)
          PY
          git add src/app/App.tsx
          git rm .github/workflows/f09-fix-app-merge.yml
          git commit -m "Fix remaining F09 App integration boundaries"
          git push origin HEAD:agent/f09-phase1-collections
