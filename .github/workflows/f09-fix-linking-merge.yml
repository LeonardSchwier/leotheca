name: Repair F09 linking merge boundaries

on:
  push:
    branches:
      - agent/f09-phase1-collections
    paths:
      - .github/workflows/f09-fix-linking-merge.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore combined cache decoder and tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Leonardschwier
          git config user.email github@leonardschwier.de
          python3 - <<'PY'
          from pathlib import Path

          store = Path("src/linking/store.ts")
          text = store.read_text()
          broken = '''    Array.isArray(record.frontmatterProperties) &&\n    record.frontmatterProperties.every(isValidFrontmatterProperty)\n    Array.isArray(record.wikiLinks) &&'''
          fixed = '''    Array.isArray(record.frontmatterProperties) &&\n    record.frontmatterProperties.every(isValidFrontmatterProperty) &&\n    Array.isArray(record.wikiLinks) &&'''
          if text.count(broken) != 1:
              raise SystemExit("expected one cached-note validator merge boundary")
          store.write_text(text.replace(broken, fixed))

          tests = Path("src/linking/store.test.ts")
          text = tests.read_text()

          wiki_fixture = '''              tasks: [],\n              // Missing required numeric source-range fields.'''
          wiki_fixed = '''              tasks: [],\n              hasFrontmatter: false,\n              frontmatterProperties: [],\n              // Missing required numeric source-range fields.'''
          if text.count(wiki_fixture) != 1:
              raise SystemExit("expected one wikiLinks malformed fixture")
          text = text.replace(wiki_fixture, wiki_fixed)

          start_marker = '''  it("drops a persisted cache entry whose headings field is malformed, forcing a real re-read instead of trusting it", async () => {'''
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("expected malformed merged tail marker")

          replacement = '''  it("drops a persisted cache entry with a malformed frontmatterProperties field, forcing a real re-read", async () => {\n    findMarkdownFiles.mockResolvedValue([\n      { name: "a.md", path: "/workspace/a.md", isDir: false, mtime: 1000, size: 5 },\n    ]);\n    readTextFile.mockImplementation(async (path: string) => {\n      if (path === CACHE_PATH) {\n        return JSON.stringify({\n          version: 6,\n          entries: {\n            "/workspace/a.md": {\n              mtime: 1000,\n              size: 5,\n              wikilinks: [],\n              aliases: [],\n              tags: [],\n              tasks: [],\n              hasFrontmatter: true,\n              frontmatterProperties: [{ kind: "scalar", key: "x" }], // missing required fields\n              wikiLinks: [],\n              headings: [],\n            },\n          },\n        });\n      }\n      return "---\\nx: 1\\n---\\n";\n    });\n\n    await expect(rebuildLinkIndex("/workspace")).resolves.toBeUndefined();\n\n    expect(readTextFile).toHaveBeenCalledWith("/workspace/a.md");\n    expect(linkIndex.value.frontmatterPropertiesByPath?.get("/workspace/a.md")).toHaveLength(1);\n    expect(linkIndexUnreadablePaths.value).toEqual([]);\n  });\n\n  it("drops a persisted cache entry whose headings field is malformed, forcing a real re-read instead of trusting it", async () => {\n    findMarkdownFiles.mockResolvedValue([\n      { name: "a.md", path: "/workspace/a.md", isDir: false, mtime: 1000, size: 5 },\n    ]);\n    readTextFile.mockImplementation(async (path: string) => {\n      if (path === CACHE_PATH) {\n        return JSON.stringify({\n          version: 6,\n          entries: {\n            "/workspace/a.md": {\n              mtime: 1000,\n              size: 5,\n              wikilinks: [],\n              aliases: [],\n              tags: [],\n              tasks: [],\n              hasFrontmatter: false,\n              frontmatterProperties: [],\n              wikiLinks: [],\n              // level out of the valid 1-6 range.\n              headings: [{ key: "x", occurrence: 1, level: 9, rawText: "X", displayText: "X", sourceFrom: 0, sourceTo: 1, contentFrom: 0, contentTo: 1, line: 1, column: 1, sectionFrom: 0, sectionTo: 1, childIndexes: [] }],\n            },\n          },\n        });\n      }\n      return "[[c]]";\n    });\n\n    await expect(rebuildLinkIndex("/workspace")).resolves.toBeUndefined();\n\n    expect(readTextFile).toHaveBeenCalledWith("/workspace/a.md");\n    expect(linkIndexUnreadablePaths.value).toEqual([]);\n  });\n});\n'''
          tests.write_text(text[:start] + replacement)
          PY
          git add src/linking/store.ts src/linking/store.test.ts
          git rm -f .f09-tsc.txt .github/workflows/f09-fix-linking-merge.yml
          git commit -m "Fix F09 linking forward integration boundaries"
          git push origin HEAD:agent/f09-phase1-collections
