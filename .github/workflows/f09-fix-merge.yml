name: Repair F09 merged icon boundary

on:
  push:
    branches:
      - agent/f09-phase1-collections
    paths:
      - .github/workflows/f09-fix-merge.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore both sidebar icon functions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Leonardschwier
          git config user.email github@leonardschwier.de
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/app/App.tsx")
          text = path.read_text()
          broken = '''      <circle cx="5.5" cy="12" r="0.6" fill="currentColor" stroke="none" />\nfunction DiagnosticsIcon() {'''
          fixed = '''      <circle cx="5.5" cy="12" r="0.6" fill="currentColor" stroke="none" />\n    </svg>\n  );\n}\n\nfunction DiagnosticsIcon() {'''
          if text.count(broken) != 1:
              raise SystemExit("expected one merged CollectionsIcon boundary")
          path.write_text(text.replace(broken, fixed))
          PY
          git add src/app/App.tsx
          git rm .github/workflows/f09-fix-merge.yml
          git commit -m "Fix F09 forward integration icon boundary"
          git push origin HEAD:agent/f09-phase1-collections
