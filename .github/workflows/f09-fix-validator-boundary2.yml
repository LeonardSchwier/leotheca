name: Retry F09 validator boundary repair

on:
  push:
    branches:
      - agent/f09-phase1-collections
    paths:
      - .github/workflows/f09-fix-validator-boundary2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore validator function boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Leonardschwier
          git config user.email github@leonardschwier.de
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/linking/store.ts")
          text = path.read_text()
          broken = '''  return false;\n/** F03 Phase 1: `wikiLinks` is a structured `WikiLinkRecord`'''
          fixed = '''  return false;\n}\n\n/** F03 Phase 1: `wikiLinks` is a structured `WikiLinkRecord`'''
          if text.count(broken) != 1:
              raise SystemExit("expected one frontmatter-validator merge boundary")
          path.write_text(text.replace(broken, fixed))
          PY
          git add src/linking/store.ts
          git rm --ignore-unmatch .f09-tsc2.txt .github/workflows/f09-capture-tsc2.yml .github/workflows/f09-fix-validator-boundary.yml .github/workflows/f09-fix-validator-boundary2.yml
          git commit -m "Fix F09 cache validator integration boundary"
          git push origin HEAD:agent/f09-phase1-collections
