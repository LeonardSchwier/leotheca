name: Probe F09 forward integration

on:
  push:
    branches:
      - agent/f09-phase1-collections
    paths:
      - .github/workflows/f09-forward-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test merge with current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Leonardschwier
          git config user.email github@leonardschwier.de
          git fetch origin main
          if git merge --no-ff --no-commit origin/main; then
            git rm .github/workflows/f09-forward-integrate.yml
            git commit -m "Forward integrate F09 Phase 1 with current main"
            git push origin HEAD:agent/f09-phase1-collections
            exit 0
          fi

          git diff --name-only --diff-filter=U
          for file in src/app/App.tsx src/linking/store.ts src/linking/store.test.ts; do
            if git diff --name-only --diff-filter=U | grep -Fxq "$file"; then
              git checkout --conflict=diff3 -- "$file"
              echo "===== $file conflict regions ====="
              python3 - "$file" <<'PY'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text().splitlines()
          starts = [i for i, line in enumerate(lines) if line.startswith("<<<<<<<")]
          for start in starts:
              end = next(i for i in range(start, len(lines)) if lines[i].startswith(">>>>>>>"))
              lo = max(0, start - 12)
              hi = min(len(lines), end + 13)
              print(f"--- lines {lo + 1}-{hi} ---")
              print("\n".join(lines[lo:hi]))
          PY
            fi
          done
          git merge --abort
          exit 1
