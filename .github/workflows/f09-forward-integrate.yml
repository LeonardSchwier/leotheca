name: Forward integrate F09 Phase 1

on:
  push:
    branches:
      - agent/f09-phase1-collections
    paths:
      - .github/workflows/f09-forward-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main into the claimed branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Leonardschwier
          git config user.email github@leonardschwier.de

          python3 - <<'PY'
          from pathlib import Path

          roadmap = Path("ROADMAP.md").read_text().splitlines()
          Path("/tmp/f09-roadmap-line").write_text(
              next(line for line in roadmap if "✅ **F09 Phase 1:" in line) + "\n"
          )
          changelog = Path("CHANGELOG.md").read_text().splitlines()
          Path("/tmp/f09-changelog-line").write_text(
              next(line for line in changelog if "A new Collections button" in line) + "\n"
          )
          PY

          git fetch origin main
          if ! git merge --no-ff --no-commit origin/main; then
            for file in ROADMAP.md CHANGELOG.md documentation/ARCHITECTURE.md; do
              if git diff --name-only --diff-filter=U -- "$file" | grep -q .; then
                git checkout --theirs -- "$file"
                git add "$file"
              fi
            done

            for file in src/app/App.tsx src/linking/store.ts src/linking/store.test.ts; do
              if ! git diff --name-only --diff-filter=U -- "$file" | grep -q .; then
                continue
              fi
              git show ":1:$file" > /tmp/base
              git show ":2:$file" > /tmp/ours
              git show ":3:$file" > /tmp/theirs
              git merge-file --union /tmp/ours /tmp/base /tmp/theirs || true
              cp /tmp/ours "$file"
              git add "$file"
            done
          fi

          python3 - <<'PY'
          from pathlib import Path

          roadmap = Path("ROADMAP.md")
          lines = roadmap.read_text().splitlines()
          completed = Path("/tmp/f09-roadmap-line").read_text().rstrip("\n")
          lines = [line for line in lines if "**F09 Phase 1:" not in line]
          implemented = lines.index("## Implemented")
          lines.insert(implemented + 2, completed)
          roadmap.write_text("\n".join(lines) + "\n")

          changelog = Path("CHANGELOG.md")
          lines = changelog.read_text().splitlines()
          entry = Path("/tmp/f09-changelog-line").read_text().rstrip("\n")
          if entry not in lines:
              unreleased = lines.index("## Unreleased")
              lines.insert(unreleased + 2, entry)
          changelog.write_text("\n".join(lines) + "\n")

          store = Path("src/linking/store.ts")
          text = store.read_text()
          needle = "const LINK_INDEX_CACHE_VERSION = 6;"
          first = text.find(needle)
          second = text.find(needle, first + len(needle))
          if first >= 0 and second >= 0:
              store.write_text(text[:second] + text[second + len(needle):])
          PY

          git diff 60634d2f1885456c3186b4ef62ccf7151fafdd01 203b617dc0b2f79e81dd7a5baa187cd32856952b -- documentation/ARCHITECTURE.md > /tmp/f09-architecture.patch
          if [ -s /tmp/f09-architecture.patch ]; then
            git apply --3way /tmp/f09-architecture.patch || true
          fi

          git add ROADMAP.md CHANGELOG.md documentation/ARCHITECTURE.md src/linking/store.ts
          git rm .github/workflows/f09-forward-integrate.yml

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            printf 'Unresolved conflicts:\n%s\n' "$unresolved"
            exit 1
          fi

          git commit -m "Forward integrate F09 Phase 1 with current main"
          git push origin HEAD:agent/f09-phase1-collections
