name: Forward integrate F09 Phase 1

on:
  push:
    branches:
      - agent/f09-phase1-collections
    paths:
      - .github/workflows/f09-forward-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main and resolve complementary feature conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Leonardschwier
          git config user.email github@leonardschwier.de

          # Preserve this branch's completed F09 roadmap entry before merging.
          python3 - <<'PY'
          from pathlib import Path
          roadmap = Path("ROADMAP.md").read_text().splitlines()
          line = next(line for line in roadmap if "✅ **F09 Phase 1:" in line)
          Path("/tmp/f09-roadmap-line").write_text(line + "\n")
          PY

          git fetch origin main
          if git merge --no-ff --no-commit origin/main; then
            :
          else
            # Current main is authoritative for coordination/docs. Reapply only
            # this branch's own completed F09 ledger entry below.
            git checkout --theirs ROADMAP.md documentation/ARCHITECTURE.md

            # App and link-index conflicts are independent additions made from
            # the same old baseline. Preserve both sides of each conflict hunk.
            for file in src/app/App.tsx src/linking/store.ts src/linking/store.test.ts; do
              git checkout --conflict=diff3 -- "$file"
              python3 - "$file" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text().splitlines(keepends=True)
          out = []
          i = 0
          while i < len(lines):
              if not lines[i].startswith("<<<<<<<"):
                  out.append(lines[i])
                  i += 1
                  continue
              i += 1
              ours = []
              while i < len(lines) and not lines[i].startswith("|||||||"):
                  ours.append(lines[i]); i += 1
              if i >= len(lines):
                  raise SystemExit(f"unterminated conflict in {path}")
              i += 1
              while i < len(lines) and not lines[i].startswith("======="):
                  i += 1
              if i >= len(lines):
                  raise SystemExit(f"missing separator in {path}")
              i += 1
              theirs = []
              while i < len(lines) and not lines[i].startswith(">>>>>>>"):
                  theirs.append(lines[i]); i += 1
              if i >= len(lines):
                  raise SystemExit(f"missing conflict end in {path}")
              i += 1
              out.extend(ours)
              out.extend(theirs)
          path.write_text("".join(out))
          PY
            done

            # Both F03 and F09 independently bumped v5 to v6. The merged cache
            # shape contains both additions, so one v6 declaration is correct.
            python3 - <<'PY'
          from pathlib import Path
          path = Path("src/linking/store.ts")
          text = path.read_text()
          needle = "const LINK_INDEX_CACHE_VERSION = 6;"
          first = text.find(needle)
          second = text.find(needle, first + len(needle))
          if first < 0 or second < 0:
              raise SystemExit("expected duplicate cache-version declarations after union merge")
          text = text[:second] + text[second + len(needle):]
          path.write_text(text)
          PY
          fi

          # Replace main's active F09 claim with the branch's completed entry,
          # while retaining every newer Implemented/Open item from main.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("ROADMAP.md")
          lines = path.read_text().splitlines()
          completed = Path("/tmp/f09-roadmap-line").read_text().rstrip("\n")
          lines = [line for line in lines if "**F09 Phase 1:" not in line]
          implemented = lines.index("## Implemented")
          lines.insert(implemented + 2, completed)
          path.write_text("\n".join(lines) + "\n")
          PY

          # Restore the F09 architecture additions on top of current main by
          # taking the branch's net architecture patch with a three-way apply.
          git diff 60634d2f1885456c3186b4ef62ccf7151fafdd01 203b617dc0b2f79e81dd7a5baa187cd32856952b -- documentation/ARCHITECTURE.md > /tmp/f09-architecture.patch
          if [ -s /tmp/f09-architecture.patch ]; then
            git apply --3way /tmp/f09-architecture.patch
          fi

          git add ROADMAP.md documentation/ARCHITECTURE.md src/app/App.tsx src/linking/store.ts src/linking/store.test.ts
          git rm .github/workflows/f09-forward-integrate.yml

          if git diff --name-only --diff-filter=U | grep .; then
            echo "Unresolved conflicts remain"
            exit 1
          fi

          npm ci
          npm run typecheck
          npm test -- --run
          npm run lint
          npm run check-version
          npm run build

          git commit -m "Forward integrate F09 Phase 1 with current main"
          git push origin HEAD:agent/f09-phase1-collections
