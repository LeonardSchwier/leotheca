name: Mobile Distribution Submission Verify

on:
  push:
    branches:
      - agent/f-droid-submission

jobs:
  verify-release-recipe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out submission branch
        uses: actions/checkout@v4
        with:
          path: submission

      - name: Check out tagged release source
        uses: actions/checkout@v4
        with:
          ref: 516249983daf5fb3dc421f9a2ad436ed22a44ea8
          path: release-source

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install pinned Node toolchain
        run: |
          curl -fsSLo /tmp/node.tar.xz https://nodejs.org/download/release/v22.23.2/node-v22.23.2-linux-x64.tar.xz
          echo "d60acfe00a2932254bb0ad20e01b0d74397a0875595de719654b214f4b03f307  /tmp/node.tar.xz" | sha256sum -c -
          sudo tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
          node --version
          npm --version

      - name: Confirm metadata is pinned to this recipe
        working-directory: submission
        run: |
          grep -F 'commit: 516249983daf5fb3dc421f9a2ad436ed22a44ea8' packaging/f-droid/com.leonardschwier.leotheca.yml
          grep -F 'node-v22.23.2-linux-x64.tar.xz' packaging/f-droid/com.leonardschwier.leotheca.yml
          grep -F 'd60acfe00a2932254bb0ad20e01b0d74397a0875595de719654b214f4b03f307' packaging/f-droid/com.leonardschwier.leotheca.yml

      - name: Prepare historical source for offline-policy compliance
        working-directory: release-source/android
        run: |
          sed -i '/com.google.gms:google-services/d' build.gradle
          sed -i '/google-services/d' app/build.gradle
          sed -i '/android.permission.INTERNET/d' app/src/main/AndroidManifest.xml
          ! grep -R -E 'com.google.gms:google-services|android.permission.INTERNET' build.gradle app/build.gradle app/src/main/AndroidManifest.xml

      - name: Build shared assets
        working-directory: release-source
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build unsigned release APK
        working-directory: release-source/android
        run: ./gradlew assembleRelease

      - name: Inspect release APK
        working-directory: release-source/android
        run: |
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$apk"
          apkanalyzer manifest permissions "$apk" | tee /tmp/leotheca-apk-permissions.txt
          ! grep -Fq android.permission.INTERNET /tmp/leotheca-apk-permissions.txt
          test "$(apkanalyzer manifest version-code "$apk")" = "1"
          test "$(apkanalyzer manifest version-name "$apk")" = "1.0"

      - name: Upload verification APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-distribution-unsigned-release-apk
          path: release-source/android/app/build/outputs/apk/release/app-release-unsigned.apk
