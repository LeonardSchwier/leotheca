name: N-005 one-time bookkeeping

on:
  push:
    branches:
      - agent/n-005-attachment-concurrency
    paths:
      - .github/workflows/n005-bookkeeping.yml

permissions:
  contents: write

jobs:
  bookkeeping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/n-005-attachment-concurrency
      - name: Record verified N-005 completion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roadmap = Path("ROADMAP.md")
          lines = roadmap.read_text().splitlines()
          active_prefix = "- 🚧 **Audit follow-up N-005: Bound Markdown attachment resolution concurrency**"
          implemented = "- ✅ **Audit follow-up N-005: Bound Markdown attachment resolution concurrency**: Replaces unbounded local preview attachment reads with a six-worker queue. Rerender or unmount stops stale workers before they schedule more queued reads, already-invoked reads cannot update obsolete DOM, and one failed attachment does not block the remaining current queue. Tests-only negative-control CI run `33353118131` proved the pre-fix preview started all 12 requested reads and all 10 obsolete reads immediately; implementation CI run `33353227555` passed the same focused regressions plus frontend typechecking/tests/build, Rust check/tests, and the Android debug APK build. No Android on-device verification is claimed."
          removed = False
          insert_at = None
          kept = []
          for line in lines:
              if line.startswith(active_prefix):
                  removed = True
                  continue
              kept.append(line)
              if line.startswith("- ✅ **Audit follow-up N-004: Contain local Markdown attachment reads**"):
                  insert_at = len(kept)
          if not removed or insert_at is None:
              raise SystemExit("ROADMAP anchors did not match expected N-004/N-005 state")
          kept.insert(insert_at, implemented)
          roadmap.write_text("\n".join(kept) + "\n")

          log = Path("agent-log/CHANGELOG.md")
          text = log.read_text()
          marker = "---\n\n"
          if marker not in text:
              raise SystemExit("agent log insertion marker missing")
          entry = """## 2026-08-31: ChatGPT (GPT-5.6 Sol), Markdown attachment read concurrency (N-005)\n\nClaimed N-005 after the integration pass merged the ready N-004 containment fix and found earlier unclaimed items either overlapping active claims or blocked by maintainer credentials or physical-device requirements. Replaced Markdown preview's unbounded local-image `fileSrc()` fan-out with six workers. A stale render stops scheduling queued reads on rerender or unmount, already-invoked reads cannot mutate obsolete DOM, and an unreadable image remains local to that image while its worker continues through the current queue.\n\nA tests-only negative control on the unmodified claim commit ran through PR CI as run `33353118131` and failed exactly at the intended regressions: the old preview scheduled all 12 reads instead of six and all 10 obsolete reads before rerender cancellation could matter. Implementation CI run `33353227555` then passed the same focused tests, frontend typechecking and production build, Rust check/tests, and the Android debug APK build. The cloud sandbox could not clone from GitHub because DNS resolution was unavailable, so repository CI was the authoritative executable verification environment. No Android on-device verification is claimed.\n\n"""
          log.write_text(text.replace(marker, marker + entry, 1))
          PY
          rm .github/workflows/n005-bookkeeping.yml
          git config user.name "Leotheca cloud routine"
          git config user.email "github@leonardschwier.de"
          git add ROADMAP.md agent-log/CHANGELOG.md .github/workflows/n005-bookkeeping.yml
          git diff --cached --check
          git commit -m "Record verified N-005 completion"
          git push origin HEAD:agent/n-005-attachment-concurrency
