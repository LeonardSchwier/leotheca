name: Release

# Builds and attaches installable artifacts to a GitHub Release. Two
# distinct release channels come out of this one workflow:
#
# - A version tag push (v*) publishes the real, versioned release: the
#   mechanism Obtainium (Android) and the README's "download from GitHub
#   Releases" instructions (Linux) both depend on. Still a draft, for the
#   Android-signing reason explained below.
# - An implementation push to main updates a rolling "dev-build" pre-release
#   (not a draft, so it's actually visible without the maintainer manually
#   publishing it) so freshly built artifacts are always available on the
#   repository's Releases page without waiting for a version tag. It is
#   recreated from scratch on every run rather than accumulating history,
#   see the publish job below, and is clearly labeled as an unreviewed
#   continuous build, never mistaken for a stable, versioned release.
#
# Publication is gated by the reusable CI workflow for this exact commit.
# The artifact build jobs below do not substitute for that validation: CI
# must report its final validation job as successful before publish can run.
# Linux and Android artifact builds are additionally required to succeed.
# Flatpak, macOS, and Windows artifacts are included when their own build
# jobs succeed; their absence is recorded in the release body.
#
# Status: Linux (AppImage) is a real build, no secrets required. Android is
# signed with the maintainer key when the four ANDROID_KEYSTORE_* / ANDROID_KEY_*
# repository secrets exist (published as leotheca-<tag>-android.apk); the
# maintainer generates and stores them, an agent never fabricates them.
# Without them the Android job creates a throw-away keystore inside the job
# (random password, never printed, never stored, new key every run) and signs a
# TEST build with it, published as leotheca-<tag>-android-TEST-ephemeral-key.apk.
# Android sees each such build as a different app. A debug-signed APK is never
# published: the publish job fails on one.
#
# Flatpak uses the flatpak/flatpak-github-actions/flatpak-builder action
# (session 55), which runs inside a container image that already bundles
# flatpak-builder and the org.gnome.Sdk/Platform runtime as root — this
# sidesteps a real blocker hit trying to do the equivalent test build on the
# maintainer's own Fedora desktop in the same session: flatpak-builder run
# as a Flatpak itself (org.flatpak.Builder, the only install path available
# without root there) could not see a --user-installed org.gnome.Sdk via its
# host-command mechanism, and Fedora's system `flathub` remote is filtered
# to a curated subset that excludes it anyway, so a real system-wide install
# would have needed `sudo`, which wasn't available non-interactively. None
# of that applies on a GitHub Actions runner (full root, unfiltered
# Flathub), so this job is the actual verification path for the manifest,
# not the local desktop.
#
# Container image tracks the manifest's runtime-version: GNOME 46's image
# (bilelmoussaoui/flatpak-github-actions:gnome-46) had a Rust 1.81.0
# toolchain frozen since ~August 2024 (GNOME 46 has been out of support for
# a long time), which stopped satisfying this project's real Cargo.lock
# (many transitive dependencies now require the `edition2024` Cargo
# feature, needing Rust 1.85+) well before it stopped satisfying anything
# npm-side. Moved to GNOME 50 (the current stable release as of this
# change) and its actively maintained image at
# ghcr.io/flathub-infra/flatpak-github-actions:gnome-50, matching
# `runtime-version` in the manifest itself, so both stay in sync.
#
# workflow_dispatch exists alongside the push triggers specifically so this
# workflow (the Flatpak job above all) can be re-run on demand while
# iterating on a real bug, without needing to delete and recreate a tag
# each time (see session 57's agent-log/CHANGELOG.md entry for the two real
# bugs the tag-triggered run itself caught and how they were fixed). A
# manual run still only uploads build artifacts to the Actions run itself —
# `publish` only runs for a real `push` event (tag or main), so a
# workflow_dispatch run intentionally can't publish either release channel.

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    # Claim/heartbeat/finish records must not republish unchanged binaries.
    # Tag pushes still run: the host does not apply path filters to tags.
    paths-ignore:
      - "ROADMAP.md"
      - ".agents/handoffs/**"
  workflow_dispatch: {}

jobs:
  validation:
    uses: ./.github/workflows/ci.yml

  # Audit follow-up F-015: a real v* tag is the one piece of release-workflow
  # metadata ci.yml's own validation job (which runs for every push, not just
  # a tag) cannot check, since it has no way to know a given commit is about
  # to become a tagged release. This job only does real work on a tag push:
  # the tag itself must equal "v" plus the VERSION file's contents (so the
  # published artifact's identity can never silently drift from the version
  # every other file was validated against), and CHANGELOG.md must already
  # have moved its "## Unreleased" notes into a matching versioned heading
  # (so a real release is never cut with an empty user-facing changelog).
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the release tag and changelog match VERSION
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "Not a tag push, nothing to guard here."
            exit 0
          fi
          version="$(cat VERSION | tr -d '[:space:]')"
          expected_tag="v${version}"
          actual_tag="${{ github.ref_name }}"
          if [ "$actual_tag" != "$expected_tag" ]; then
            echo "Tag '$actual_tag' does not match the VERSION file (expected '$expected_tag')." >&2
            echo "Update VERSION (and every file npm run check-version validates against it) before retagging." >&2
            exit 1
          fi
          escaped_version="$(printf '%s' "$version" | sed 's/[.[\*^$]/\\&/g')"
          if ! grep -qE "^## ${escaped_version}([[:space:]]|\$)" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## ${version}' heading." >&2
            echo "Move the '## Unreleased' section into a versioned heading before tagging a release." >&2
            exit 1
          fi

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev build-essential libssl-dev squashfs-tools p7zip-full
      - run: npm ci
      - name: Cache the Tauri bundling tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Build AppImage
        run: |
          # Build a fresh AppDir. Fedora's bundled linuxdeploy can fail after
          # producing it, so validate that usable output before continuing.
          cd src-tauri && cargo clean && cd ..
          scripts/retry.sh npx tauri build --bundles appimage || {
            test -x src-tauri/target/release/bundle/appimage/Leotheca.AppDir/AppRun
            test -x src-tauri/target/release/bundle/appimage/Leotheca.AppDir/usr/bin/leotheca
          }
          appdir=src-tauri/target/release/bundle/appimage/Leotheca.AppDir
          ln -sf Leotheca.png "$appdir/leotheca.png"
          ARCH=x86_64 "$HOME/.cache/tauri/linuxdeploy-plugin-appimage.AppImage" --appimage-extract-and-run --appdir="$appdir"
      - name: Patch AppImage MIME type for URL scheme
        run: bash src-tauri/resources/patch-appimage-mime.sh Leotheca-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: Leotheca-x86_64.AppImage

  macos:
    # A universal binary (both Apple Silicon and Intel) rather than just
    # whatever architecture the runner happens to be, matching the same
    # "download one artifact that works" expectation the Linux AppImage and
    # the Homebrew Cask draft (packaging/homebrew/README.md) already assume.
    # Needs both Rust targets installed; a plain `tauri build` without
    # --target would only produce a native build for the runner's own
    # architecture.
    #
    # Signing/notarization (ROADMAP rm-dcbbb805ce521c18): this job exports
    # the Developer ID certificate and App Store Connect API key so
    # `tauri build` can sign the .app bundle, and the job runs `notarytool`
    # submit + wait + staple afterwards. When the signing secrets are not
    # yet configured (today's state), `tauri build` falls back to ad-hoc
    # signing, `notarytool` submits are skipped, and the release body
    # already states the artifact is unsigned. Once the maintainer has
    # provided APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
    # APPLE_TEAM_ID, and APPLE_API_ISSUER/APPLE_API_KEY/APPLE_API_KEY_ID
    # as repository secrets, release artifacts are signed, notarized, and
    # stapled with no workflow change needed on that path.
    runs-on: macos-latest
    outputs:
      # Set to "true" only when the notarize+staple step ran AND its
      # codesign/spctl verification passed. Used by the publish job to
      # word the release body accurately.
      signing_verified: ${{ steps.notarize.outputs.signing_verified }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Import Developer ID certificate and App Store Connect API key
        # `tauri build`'s bundler looks up `APPLE_CERTIFICATE` in the
        # keychain when signing, and `notarytool` (below) authenticates
        # with the App Store Connect API key. When these secrets are not
        # configured (today's state), the steps are skipped with a clear
        # log message, and the build proceeds with ad-hoc signing.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -e
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "macos-release-signing: all secrets configured -- signing + notarization enabled"
            echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
            security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" build.keychain-db
            security import /tmp/cert.p12 -k build.keychain-db -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-keychain-settings -lut 21600 build.keychain-db
            security list-keychains -d user -s build.keychain-db "$(security list-keychains -d user | tr -d '[:space:]')"
            rm /tmp/cert.p12
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            echo "$APPLE_API_KEY" > /tmp/AuthKey.p8
            echo "APPLE_API_KEY_FILE=/tmp/AuthKey.p8" >> "$GITHUB_ENV"
            echo "MACOS_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "macos-release-signing: signing/notarization secrets not configured -- falling back to ad-hoc signing and skipping notarization"
            echo "MACOS_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
          fi
      - name: Fail release publication if notarization secrets are incomplete
        # Tauri's bundler signs a macOS .app with a Developer ID certificate
        # and submits it to Apple's notarization service only when ALL of
        # the APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_TEAM_ID,
        # APPLE_API_ISSUER, APPLE_API_KEY, and APPLE_API_KEY_ID
        # environment variables are set. Providing only some of them
        # silently produces an unsigned bundle. Failing fast here makes
        # that configuration error a visible, diagnosable release job
        # failure instead of a silently unsigned artifact, which is what
        # the publish job's existing "macOS build job failed" note in
        # the release body would then correctly describe.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -e
          missing=""
          present=""
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_ID; do
            if [ -z "${!var}" ]; then missing="$missing $var"; else present="$present $var"; fi
          done
          if [ -n "$missing" ] && [ -n "$present" ]; then
            echo "::error::macos-release-signing: partial Apple signing configuration is not allowed. Missing: $missing"
            echo "::error::Provide either ALL of the signing secrets (to enable signing+notarization) or NONE (for an explicitly unsigned, Gatekeeper-warned release). A partial set would silently produce an unsigned bundle."
            exit 1
          fi
          if [ -n "$missing" ]; then
            echo "macos-release-signing: no signing secrets configured -- proceeding with an explicitly unsigned release (Gatekeeper will warn users)."
          else
            echo "macos-release-signing: full signing configuration present -- signing+notarization will run."
          fi
      - name: Build universal app and DMG
        # Both bundle types are requested on purpose: with `dmg` alone Tauri
        # deletes the intermediate .app, which the notarize step needs. The
        # document types and icon come from bundle.macOS in tauri.conf.json, so
        # they are inside the bundle before it is signed and packed into the DMG.
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg
      - name: Verify the document icon and types are in the bundle
        run: |
          set -e
          APP_PATH=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then echo "::error::No .app found"; exit 1; fi
          test -f "$APP_PATH/Contents/Resources/docs-icon.icns"
          plutil -extract CFBundleDocumentIcons json -o - "$APP_PATH/Contents/Info.plist" | grep -q docs-icon
          plutil -extract CFBundleDocumentTypes json -o - "$APP_PATH/Contents/Info.plist" | grep -q markdown
      - name: Notarize and staple the .app and DMG
        # Runs only when the signing secrets are configured. `notarytool`
        # with `--wait` blocks until Apple accepts the submission; staple
        # embeds the ticket locally so Gatekeeper verification succeeds
        # without a network round-trip on first open. Failure to notarize
        # or staple fails the job, so the publish job's existing
        # "macOS build job failed" note in the release body covers this
        # path.
        id: notarize
        if: env.MACOS_SIGNING_ENABLED == 'true'
        env:
          APPLE_API_ISSUER: ${{ env.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY_FILE }}
          APPLE_API_KEY_ID: ${{ env.APPLE_API_KEY_ID }}
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
        run: |
          set -e
          APP_DIR="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          DMG_DIR="src-tauri/target/universal-apple-darwin/release/bundle/dmg"
          APP_PATH=$(find "$APP_DIR" -maxdepth 1 -name "*.app" -type d | head -1)
          DMG_PATH=$(find "$DMG_DIR" -maxdepth 1 -name "*.dmg" | head -1)
          echo "Notarizing: $APP_PATH"
          xcrun notarytool submit "$APP_PATH" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          echo "Stapling ticket to .app and DMG"
          xcrun stapler staple "$APP_PATH"
          xcrun stapler staple "$DMG_PATH"
          echo "Verifying signatures and staple status"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$DMG_PATH"
          spctl --assess --type exec --verbose "$APP_PATH" 2>&1 || \
            echo "WARNING: spctl --assess failed; this can happen on CI runners without a local gatekeeper context. Continuing since notarytool --wait already confirmed acceptance."
          echo "signing_verified=true" >> "$GITHUB_OUTPUT"
          echo "macos-release-signing: notarization + staple + verify complete"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Cache the Tauri bundling tools
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Build MSI
        shell: bash
        run: scripts/retry.sh npx tauri build --bundles msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi

  android:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
      ephemeral: ${{ steps.signing.outputs.ephemeral }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # Google removed the legacy "tools" package from the SDK repository
          # (2026-09-15); the action's own default ("tools platform-tools")
          # now fails sdkmanager outright. platform-tools is all this job
          # needs itself -- the Android Gradle Plugin fetches whichever
          # platform/build-tools versions the project requires during the
          # Gradle build steps below.
          packages: platform-tools
      - run: npm ci
      - run: npx vite build
      - run: npx cap sync android
      - name: Cache the Gradle wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Warm up the Gradle wrapper (downloads the distribution, retried)
        working-directory: android
        run: ../scripts/retry.sh ./gradlew --version
      - name: Choose the release key (maintainer key, else a throw-away test key)
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          present=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; else present=$((present + 1)); fi
          done
          if [ "$present" -eq 4 ]; then
            keystore="$RUNNER_TEMP/leotheca-release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
            test -s "$keystore"
            echo "::add-mask::$ANDROID_KEY_ALIAS"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "ephemeral=false" >> "$GITHUB_OUTPUT"
            echo "keystore=$keystore" >> "$GITHUB_OUTPUT"
            echo "android-release-signing: all four secrets present, signing the release APK."
            exit 0
          fi
          if [ "$present" -ne 0 ]; then
            echo "::error::android-release-signing: only part of the signing secrets is set (missing:$missing). Set all four or none."
            exit 1
          fi
          # No secrets: sign a TEST build with a key made here and thrown away
          # with the runner. The password is random, masked, written only to a
          # file in RUNNER_TEMP, and never printed or uploaded. The key is new
          # on every run, so Android treats every build as a different app.
          keystore="$RUNNER_TEMP/leotheca-ephemeral.keystore"
          passfile="$RUNNER_TEMP/leotheca-ephemeral.pass"
          rm -f "$keystore" "$passfile"
          (umask 077 && openssl rand -hex 24 > "$passfile")
          test -s "$passfile"
          echo "::add-mask::$(cat "$passfile")"
          keytool -genkeypair -keystore "$keystore" -storetype PKCS12 \
            -storepass:file "$passfile" -keypass:file "$passfile" \
            -alias leotheca-test -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=Leotheca TEST ephemeral key, O=not a release key" > /dev/null
          test -s "$keystore"
          echo "signed=false" >> "$GITHUB_OUTPUT"
          echo "ephemeral=true" >> "$GITHUB_OUTPUT"
          echo "keystore=$keystore" >> "$GITHUB_OUTPUT"
          echo "passfile=$passfile" >> "$GITHUB_OUTPUT"
          echo "android-release-signing: no signing secrets. Building a TEST apk signed with a throw-away key generated in this job."
          echo "::warning title=Android TEST apk::No Android signing secrets are set. The published APK is signed with a throw-away key made in this job, so every build is a different app to Android (uninstall before installing the next). It is named leotheca-<tag>-android-TEST-ephemeral-key.apk. The debug key is never used."
      - name: Build release APK
        working-directory: android
        env:
          LEOTHECA_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          KEY_PASSWORD_FILE: ${{ steps.signing.outputs.passfile }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEY_PASSWORD_FILE" ]; then
            LEOTHECA_KEYSTORE_PASSWORD="$(cat "$KEY_PASSWORD_FILE")"
            LEOTHECA_KEY_PASSWORD="$LEOTHECA_KEYSTORE_PASSWORD"
            LEOTHECA_KEY_ALIAS=leotheca-test
          else
            LEOTHECA_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            LEOTHECA_KEY_PASSWORD="$KEY_PASSWORD"
            LEOTHECA_KEY_ALIAS="$KEY_ALIAS"
          fi
          export LEOTHECA_KEYSTORE_FILE LEOTHECA_KEYSTORE_PASSWORD LEOTHECA_KEY_ALIAS LEOTHECA_KEY_PASSWORD
          ./gradlew assembleRelease
      - name: Verify the APK is signed and is not debug-signed
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          debug_sha="$(keytool -list -v -keystore android/debug.keystore -storepass android | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1)"
          test -n "$debug_sha" || { echo "::error::Could not read the debug certificate SHA-256 from android/debug.keystore, so a debug-signed APK could not be recognised."; exit 1; }
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/apk-certs.txt"
          node scripts/verifyApkNotDebugSigned.mjs --debug-sha256 "$debug_sha" < "$RUNNER_TEMP/apk-certs.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Point the manifest at this commit
        # The checked-in manifest pins a stable commit for Flathub. Building that
        # here would publish old code as the rolling dev-build.
        run: |
          sed -E '/^ +- type: git$/,/^ +commit: /c\      - type: dir\n        path: ..\n        skip: [flatpak_app, repo, node_modules, src-tauri/target, Leotheca-x86_64.AppImage]' \
            flatpak/com.leonardschwier.leotheca.yml > flatpak/com.leonardschwier.leotheca.dev.yml
          grep -q 'type: dir' flatpak/com.leonardschwier.leotheca.dev.yml
          if grep -q 'type: git' flatpak/com.leonardschwier.leotheca.dev.yml; then exit 1; fi
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: leotheca.flatpak
          manifest-path: flatpak/com.leonardschwier.leotheca.dev.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: leotheca.flatpak

  publish:
    needs: [validation, version-guard, linux, android, flatpak, macos, windows]
    # Real push events only, never workflow_dispatch (a manual run has no
    # single unambiguous release identity to attach artifacts to, see the
    # workflow_dispatch note above). The same-commit canonical validation,
    # the tag/changelog version guard, the Linux artifact, and the Android
    # artifact must all succeed. `always()` is needed so this job can make
    # the result check explicit when an optional artifact job fails rather
    # than being skipped by dependency semantics.
    if: always() && github.event_name == 'push' && needs.validation.result == 'success' && needs.version-guard.result == 'success' && needs.linux.result == 'success' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    # Serialise publishes of the same release. Overlapping main runs raced on
    # the rolling dev-build release and one failed with "Not Found -
    # update-a-release-asset". Queue instead of cancelling a running publish.
    # Each version tag has its own group so a later main push can never
    # replace a pending tag publish.
    concurrency:
      group: release-publish-${{ github.ref_type == 'tag' && github.ref_name || 'dev-build' }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Refuse to publish any debug-signed APK
        # Last gate before release. Whatever APK sits in the downloaded
        # artifacts, from whichever job, must carry a non-debug signature.
        run: |
          debug_sha="$(keytool -list -v -keystore android/debug.keystore -storepass android | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1)"
          test -n "$debug_sha" || { echo "::error::Could not read the debug certificate SHA-256 from android/debug.keystore, so a debug-signed APK could not be recognised."; exit 1; }
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          found=0
          while IFS= read -r apk; do
            found=1
            echo "Checking $apk"
            if ! "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"; then
              echo "::error::$apk has no valid signature, refusing to publish it."
              exit 1
            fi
            cat "$RUNNER_TEMP/certs.txt"
            node scripts/verifyApkNotDebugSigned.mjs --debug-sha256 "$debug_sha" < "$RUNNER_TEMP/certs.txt"
          done < <(find artifacts -name '*.apk' -type f)
          if [ "$found" = 0 ]; then
            echo "No Android APK among the artifacts: none will be published."
          fi
      - name: Determine this run's release identity
        id: release
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "name=Leotheca ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=legacy" >> "$GITHUB_OUTPUT"
            body=""
          else
            tag=dev-build
            echo "tag=dev-build" >> "$GITHUB_OUTPUT"
            echo "name=Development build ($(date -u +%Y-%m-%d), ${GITHUB_SHA::7})" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            body="Automatically rebuilt from the latest push to main (commit ${GITHUB_SHA}). This is the rolling release: it always holds the newest build of main, it is unreviewed, and there are no other releases at the moment. The macOS and Windows builds are unsigned and un-notarized (no code-signing certificate is configured yet): macOS will show an \"unidentified developer\" Gatekeeper warning on first open, and Windows may show a SmartScreen warning."
          fi
          if [ "${{ needs.android.outputs.ephemeral }}" = "true" ]; then
            body="${body}"$'\n\n'"The Android file in this run (leotheca-${tag}-android-TEST-ephemeral-key.apk) is a TEST build. It is signed with a random throw-away key made during this build, because the maintainer's release key is not configured. Android treats every such build as a different app: uninstall the previous one before installing the next, there are no in-place updates, and Obtainium and F-Droid cannot track it. The public debug key is never used."
          elif [ "${{ needs.android.outputs.signed }}" = "true" ]; then
            body="${body}"$'\n\n'"The Android APK in this run is signed with the maintainer's release key."
          else
            body="${body}"$'\n\n'"No Android APK is included in this run: the android job did not produce a signed APK."
          fi
          if [ "${{ needs.flatpak.result }}" != "success" ]; then
            body="${body}"$'\n\n'"Flatpak bundle not included in this run: the flatpak build job failed (see this commit's Actions run), a pre-existing issue already tracked in ROADMAP.md, not something this release broke."
          fi
          if [ "${{ needs.macos.result }}" != "success" ]; then
            body="${body}"$'\n\n'"macOS build not included in this run: the macos build job failed (see this commit's Actions run)."
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ needs.macos.outputs.signing_verified }}" != "true" ]; then
            body="${body}"$'\n\n'"macOS build in this run is unsigned and un-notarized: no code-signing certificate is configured on the release runner, so macOS will show an \"unidentified developer\" Gatekeeper warning on first open. This is a pre-existing limitation already tracked in ROADMAP.md, not something this release broke. Windows may show a SmartScreen warning on unsigned builds."
          fi
          if [ "${{ needs.windows.result }}" != "success" ]; then
            body="${body}"$'\n\n'"Windows build not included in this run: the windows build job failed (see this commit's Actions run)."
          fi
          if [ "${{ needs.macos.result }}" = "success" ] && [ "${{ github.event_name }}" = "push" ] && [ "${{ needs.macos.outputs.signing_verified }}" = "true" ]; then
            body="${body}"$'\n\n'"macOS build in this run is signed, notarized, and stapled: the release runner's Apple Developer ID certificate and App Store Connect API key were both present and Apple's notarization service accepted the submission before this artifact was published."
          fi
          {
            echo "body<<RELEASE_BODY_EOF"
            echo "$body"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Name the Android artifact after the release
        run: |
          if [ -f artifacts/android-release-apk/app-release.apk ]; then
            suffix=""
            if [ "${{ needs.android.outputs.ephemeral }}" = "true" ]; then suffix="-TEST-ephemeral-key"; fi
            mv artifacts/android-release-apk/app-release.apk "artifacts/android-release-apk/leotheca-${{ steps.release.outputs.tag }}-android${suffix}.apk"
          fi
      - name: Delete the previous dev-build release and tag, if any
        if: steps.release.outputs.tag == 'dev-build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete dev-build --yes --cleanup-tag --repo "${{ github.repository }}" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          body: ${{ steps.release.outputs.body }}
          draft: ${{ steps.release.outputs.draft }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          make_latest: ${{ steps.release.outputs.make_latest }}
          files: |
            artifacts/linux-appimage/*.AppImage
            artifacts/android-release-apk/*.apk
            artifacts/flatpak-bundle/*.flatpak
            artifacts/macos-dmg/dmg/*.dmg
            artifacts/windows-msi/*.msi
