apply plugin: 'com.android.application'

// Release signing comes only from the environment (CI secrets, see
// packaging/STATUS.md). With any value missing the release APK stays unsigned,
// which is what F-Droid expects. The release build type never falls back to
// the public debug key below: that key is committed with well-known passwords,
// so an APK signed with it can be replaced by anyone.
def releaseSigningEnv = [
    storeFile    : System.getenv('LEOTHECA_KEYSTORE_FILE'),
    storePassword: System.getenv('LEOTHECA_KEYSTORE_PASSWORD'),
    keyAlias     : System.getenv('LEOTHECA_KEY_ALIAS'),
    keyPassword  : System.getenv('LEOTHECA_KEY_PASSWORD'),
]
def hasReleaseSigning = releaseSigningEnv.values().every { it != null && !it.trim().isEmpty() }

android {
    namespace "com.leonardschwier.leotheca"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.leonardschwier.leotheca"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Kept in sync with the root VERSION file (audit follow-up F-015):
        // versionName mirrors it exactly, and versionCode is derived from it
        // as major*10000 + minor*100 + patch (see scripts/versionConsistency.js),
        // which stays monotonically increasing across ordinary releases without
        // a separately hand-maintained counter. Validated by `npm run check-version`.
        versionCode 10000
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseSigningEnv.storeFile)
                storePassword releaseSigningEnv.storePassword
                keyAlias releaseSigningEnv.keyAlias
                keyPassword releaseSigningEnv.keyPassword
            }
        }
    }
    lint {
        // Reviewed leftovers live in lint-baseline.xml (see master-spec.md change log
        // for the reason of each group). New findings of any kind still fail the job.
        baseline = file("lint-baseline.xml")
        abortOnError = true
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
