<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Leotheca app icon</title>
  <desc id="desc">A lion's head rising from an open reference book.</desc>
  <rect width="512" height="512" rx="112" fill="#152229"/>
  <!-- Open volume: the two page blocks make the bibliographic reference explicit. -->
  <path d="M86 343V174c49-25 103-24 154 7v181c-51-29-105-29-154-19Z" fill="#F3EBDD"/>
  <path d="M426 343V174c-49-25-103-24-154 7v181c51-29 105-29 154-19Z" fill="#F3EBDD"/>
  <path d="M256 185v165" fill="none" stroke="#BF9B5E" stroke-linecap="round" stroke-width="10"/>
  <!-- Page rules, kept sparse so they read as a book even at launcher size. -->
  <path d="M117 226h72M117 254h88M117 282h61M323 226h72M307 254h88M334 282h61" fill="none" stroke="#C9BFAE" stroke-linecap="round" stroke-width="10"/>
  <!-- Lion mane. Its three lobes echo turning pages. -->
  <path d="M256 99c-63 0-109 48-109 112 0 31 13 60 34 80l18-28 17 27 22-20 18 29 18-29 22 20 17-27 18 28c21-20 34-49 34-80 0-64-46-112-109-112Z" fill="#BF9B5E"/>
  <!-- Lion face. -->
  <path d="M256 132c-36 0-65 29-65 66 0 39 18 73 43 91l22 16 22-16c25-18 43-52 43-91 0-37-29-66-65-66Z" fill="#F3EBDD"/>
  <!-- Rounded features keep the lion welcoming rather than severe. -->
  <circle cx="230" cy="205" r="7" fill="#152229"/>
  <circle cx="282" cy="205" r="7" fill="#152229"/>
  <path d="M256 227c-8 0-13 4-13 9 0 6 6 10 13 10s13-4 13-10c0-5-5-9-13-9Z" fill="#152229"/>
  <path d="M256 246v12M228 265c9 19 47 19 56 0" fill="none" stroke="#152229" stroke-linecap="round" stroke-width="9"/>
  <!-- A brass baseline unifies book and mark. -->
  <path d="M105 374c92-22 210-22 302 0" fill="none" stroke="#BF9B5E" stroke-linecap="round" stroke-width="14"/>
 </svg>
