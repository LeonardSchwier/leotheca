id: com.leonardschwier.leotheca
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: leotheca

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
  env:
    CARGO_HOME: /run/build/leotheca/cargo
    # 2026-10-07: do NOT set npm_config_offline. The flatpak-node-generator
    # provider imports node-sources.json into the npm cache, and `npm ci`
    # with `--legacy-peer-deps` is purely lockfile-driven (no arborist
    # resolution, no peer-dep metadata fetches). Setting
    # npm_config_offline=true forces make-fetch-happen into only-if-cached
    # mode, which fails when the cache import misses a package (e.g.
    # zod-validation-error 4.0.2, CI run 37640985067).
    npm_config_cache: /run/build/leotheca/flatpak-node/npm-cache
    ESBUILD_BINARY_PATH: /run/build/leotheca/flatpak-node/cache/esbuild/bin/esbuild-current

modules:
  - name: leotheca
    buildsystem: simple
    build-commands:
      # Points cargo at the vendored crates flatpak-cargo-generator laid
      # out (see cargo-sources.json) instead of crates.io, which the
      # sandboxed build can't reach. Must run before any cargo command.
      - mkdir -p "$CARGO_HOME"
      - cp cargo-config.toml "$CARGO_HOME/config.toml"
      # Offline npm install + Rust dependency fetch, using the
      # pre-generated source lists below, then a Tauri build without
      # its own bundling step (Flatpak does the bundling here).
      #
      # `npm ci --legacy-peer-deps` on Node 22 / npm 10.9.x:
      # - `npm ci` is purely lockfile-driven (no arborist resolution),
      #   so it never fetches bare package metadata from the registry.
      # - `--legacy-peer-deps` skips peer-dependency validation, avoiding
      #   the eslint-plugin-compat / eslint peer conflict that triggers
      #   registry fetches even in `npm ci` (see flatpak_node_generator
      #   provider code — node-sources.json has no bare metadata entries).
      # - Node 22's npm 10.9.x contains the arborist fix for the
      #   "Exit handler never called!" crash (npm/cli#4926) that made
      #   `npm ci` abort under Node 20's npm 10.8.2.
      # - `npm_config_offline=true` (set in build-options env) guarantees
      #   npm never attempts a network call.
      # - The `node node_modules/typescript/bin/tsc` invocation below is
      #   a belt-and-suspenders guard: works even if .bin symlinks are
      #   missing from a partial install.
      # 2026-10-07: use `npm ci` with `--offline` and `--cache` explicitly.
      # The "Exit handler never called!" crash (npm/cli#4926) happens with
      # `npm install --prefer-offline` (CI run 37682317519). `npm ci` with
      # `--offline` forces npm to use the cache only, avoiding network calls
      # that might trigger the arborist crash.
      #
      # The `--cache` flag explicitly points to the flatpak-node cache,
      # ensuring npm uses the packages downloaded by flatpak-builder.
      #
      # `--legacy-peer-deps` is NOT used because the peer conflict
      # (eslint-plugin-compat / eslint) might be triggering the crash.
      # If `npm ci` fails with a peer conflict, we'll add it back.
      - node --version && npm --version
      - /usr/lib/sdk/node22/bin/npm ci --offline --cache /run/build/leotheca/flatpak-node/npm-cache
      - cargo --offline fetch --manifest-path src-tauri/Cargo.toml
      # 2026-10-07: call tsc and vite directly through node rather than
      # via .bin symlinks. Works even if the .bin symlink step was
      # skipped by a partial install. Fails with a clear diagnostic
      # instead of `tsc: command not found`.
      - 'test -f node_modules/typescript/bin/tsc || { echo "ERROR: typescript not installed - npm install failed to place it"; ls -la node_modules 2>/dev/null | head -20; exit 1; }'
      - 'test -f node_modules/vite/bin/vite.js || { echo "ERROR: vite not installed - npm install failed to place it"; ls -la node_modules 2>/dev/null | head -20; exit 1; }'
      - node node_modules/typescript/bin/tsc -p tsconfig.json --noEmit
      - node node_modules/vite/bin/vite.js build
      - cargo build --release --manifest-path src-tauri/Cargo.toml --offline
      - install -Dm755 src-tauri/target/release/leotheca /app/bin/leotheca
      - install -Dm644 com.leonardschwier.leotheca.desktop /app/share/applications/com.leonardschwier.leotheca.desktop
      - install -Dm644 com.leonardschwier.leotheca.metainfo.xml /app/share/metainfo/com.leonardschwier.leotheca.metainfo.xml
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.leonardschwier.leotheca.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/com.leonardschwier.leotheca.png
    sources:
      # New submissions must build from a stable, reproducibly pinned source
      # instead of depending on this repository's checkout being present.
      #
      # 2026-10-06: pinned to the v1.0.0 tag commit (f87bc5a), which is
      # reachable on main. The previous pin (5162499) was an orphan commit
      # not on any branch — flatpak-builder's `git fetch` couldn't retrieve
      # it ("fatal: unable to read tree"). Lockfiles are identical between
      # the two commits (verified by md5sum), so the offline source lists
      # (node-sources.json, cargo-sources.json) still match.
      - type: git
        url: https://github.com/LeonardSchwier/leotheca.git
        commit: f87bc5acca789566d5712b2c0396330b541d38e0
      # Keep submission metadata alongside the manifest so the same files
      # can be copied to the external submission repository unchanged.
      - type: file
        path: cargo-config.toml
      - type: file
        path: com.leonardschwier.leotheca.desktop
      - type: file
        path: com.leonardschwier.leotheca.metainfo.xml
      # Generated by flatpak-node-generator/flatpak-cargo-generator, see
      # flatpak/README.md for how to regenerate them after a dependency
      # change (package-lock.json or Cargo.lock).
      - node-sources.json
      - cargo-sources.json
