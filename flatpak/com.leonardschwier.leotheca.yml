id: com.leonardschwier.leotheca
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node20
command: leotheca

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node20/bin
  env:
    CARGO_HOME: /run/build/leotheca/cargo
    # 2026-10-06: removed `npm_config_offline: "true"` — this environment
    # variable forces offline mode for ALL npm commands in the sandbox,
    # overriding even `--prefer-offline`. The sandbox has no network
    # access, but the flatpak-builder container pre-downloads all packages
    # listed in node-sources.json into the npm cache. As long as the
    # cache is complete, npm can find everything it needs without
    # hitting the network. The env var was a belt-and-suspenders measure
    # that backfired when the cache was incomplete.
    npm_config_cache: /run/build/leotheca/flatpak-node/npm-cache
    ESBUILD_BINARY_PATH: /run/build/leotheca/flatpak-node/cache/esbuild/bin/esbuild-current

modules:
  - name: leotheca
    buildsystem: simple
    build-commands:
      # Points cargo at the vendored crates flatpak-cargo-generator laid
      # out (see cargo-sources.json) instead of crates.io, which the
      # sandboxed build can't reach. Must run before any cargo command.
      - mkdir -p "$CARGO_HOME"
      - cp cargo-config.toml "$CARGO_HOME/config.toml"
      # Offline npm install and Rust dependency fetch, using the
      # pre-generated source lists below, then a Tauri build without its
      # own bundling step (Flatpak does the bundling here instead).
      #
      # `npm ci`, deliberately not `npm install --offline` (session
      # 57's reasoning here, see ROADMAP.md/agent-log/CHANGELOG.md). That
      # reasoning turned out to be incomplete: `npm ci` alone still hit the
      # registry and failed identically (confirmed directly in CI run
      # 33727266020, on lockfiles regenerated against the manifest's own
      # pinned commit, ruling out a stale/wrong-commit source list as the
      # cause). The real trigger is this project's real eslint
      # peer-dependency conflicts (eslint-plugin-compat's peer range is
      # eslint ^4-7, the root project pins eslint ^10.9.1): npm's arborist
      # logs "ERESOLVE overriding peer dependency" for these during `npm
      # ci` too, not just `npm install`, and immediately after doing so it
      # fetches bare package metadata (no version pinned, e.g.
      # registry.npmjs.org/eslint) to actually perform that override
      # decision -- a kind of request flatpak-node-generator's
      # node-sources.json cache never contains entries for (confirmed by
      # reading flatpak_node_generator/providers/npm.py directly), so it
      # fails under `--offline` regardless of which install subcommand
      # triggers it. `--legacy-peer-deps` restores npm's pre-v7 behavior of
      # never validating or resolving peerDependencies conflicts at all,
      # which skips this exact code path entirely, so it never fetches
      # anything to decide an override that no longer happens; it changes
      # nothing about which package versions get installed, since those are
      # still taken as-is from package-lock.json either way.
      # 2026-10-07: switched from `npm ci` to `npm install` for resilience
      # against the "Exit handler never called!" npm/cli#4926 crash that
      # `npm ci` reliably hits on this lockfile (confirmed in the Flatpak CI
      # run of 2026-10-07T09:00). The crash aborts before `npm ci` writes
      # the .bin symlinks, so `node_modules/.bin/tsc` never exists and the
      # subsequent `npm run build` dies with `tsc: command not found`.
      # `npm install` with the same `--legacy-peer-deps` flag does the same
      # resolution work but writes .bin links incrementally as packages
      # land on disk, so even if the arborist crash fires mid-run the
      # typescript/vite binaries are already in place. The
      # `node_modules/typescript/bin/tsc` fallback below is a belt-
      # and-suspenders guard for that partial-install case.
      - npm install --legacy-peer-deps
      - cargo --offline fetch --manifest-path src-tauri/Cargo.toml
      # 2026-10-07: call tsc and vite directly through node rather than
      # relying on the .bin symlinks that `npm ci`'s "Exit handler never
      # called!" crash (npm/cli#4926, confirmed in the 2026-10-07T09:00
      # Flatpak CI run) leaves missing. `npm install` writes .bin links
      # incrementally as packages land on disk, so even a partial install
      # usually has typescript/vite present; the node-direct invocation
      # below works either way. Fails with a clear message instead of
      # `tsc: command not found` if typescript itself is missing.
      - 'test -f node_modules/typescript/bin/tsc || { echo "ERROR: typescript not installed - npm install failed to place it"; ls -la node_modules 2>/dev/null | head -20; exit 1; }'
      - 'test -f node_modules/vite/bin/vite.js || { echo "ERROR: vite not installed - npm install failed to place it"; ls -la node_modules 2>/dev/null | head -20; exit 1; }'
      - node node_modules/typescript/bin/tsc -p tsconfig.json --noEmit
      - node node_modules/vite/bin/vite.js build
      - cargo build --release --manifest-path src-tauri/Cargo.toml --offline
      - install -Dm755 src-tauri/target/release/leotheca /app/bin/leotheca
      - install -Dm644 com.leonardschwier.leotheca.desktop /app/share/applications/com.leonardschwier.leotheca.desktop
      - install -Dm644 com.leonardschwier.leotheca.metainfo.xml /app/share/metainfo/com.leonardschwier.leotheca.metainfo.xml
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.leonardschwier.leotheca.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/com.leonardschwier.leotheca.png
    sources:
      # New submissions must build from a stable, reproducibly pinned source
      # instead of depending on this repository's checkout being present.
      #
      # 2026-10-06: pinned to the v1.0.0 tag commit (f87bc5a), which is
      # reachable on main. The previous pin (5162499) was an orphan commit
      # not on any branch — flatpak-builder's `git fetch` couldn't retrieve
      # it ("fatal: unable to read tree"). Lockfiles are identical between
      # the two commits (verified by md5sum), so the offline source lists
      # (node-sources.json, cargo-sources.json) still match.
      - type: git
        url: https://github.com/LeonardSchwier/leotheca.git
        commit: f87bc5acca789566d5712b2c0396330b541d38e0
      # Keep submission metadata alongside the manifest so the same files
      # can be copied to the external submission repository unchanged.
      - type: file
        path: cargo-config.toml
      - type: file
        path: com.leonardschwier.leotheca.desktop
      - type: file
        path: com.leonardschwier.leotheca.metainfo.xml
      # Generated by flatpak-node-generator/flatpak-cargo-generator, see
      # flatpak/README.md for how to regenerate them after a dependency
      # change (package-lock.json or Cargo.lock).
      - node-sources.json
      - cargo-sources.json
