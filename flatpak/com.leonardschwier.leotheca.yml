id: com.leonardschwier.leotheca
runtime: org.gnome.Platform
runtime-version: "46"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node20
command: leotheca

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Read-write access to the user's own folders, needed to open a
  # workspace folder anywhere the user picks, not just inside the sandbox.
  - --filesystem=home

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node20/bin
  env:
    CARGO_HOME: /run/build/leotheca/cargo
    npm_config_offline: "true"
    npm_config_cache: /run/build/leotheca/flatpak-node/npm-cache

modules:
  - name: leotheca
    buildsystem: simple
    build-commands:
      # Points cargo at the vendored crates flatpak-cargo-generator laid
      # out (see cargo-sources.json) instead of crates.io, which the
      # sandboxed build can't reach. Must run before any cargo command.
      - mkdir -p "$CARGO_HOME"
      - cp flatpak/cargo-config.toml "$CARGO_HOME/config.toml"
      # Offline npm install and Rust dependency fetch, using the
      # pre-generated source lists below, then a Tauri build without its
      # own bundling step (Flatpak does the bundling here instead).
      - npm ci --offline
      - cargo --offline fetch --manifest-path src-tauri/Cargo.toml
      - npm run build
      - cargo build --release --manifest-path src-tauri/Cargo.toml --offline
      - install -Dm755 src-tauri/target/release/leotheca /app/bin/leotheca
      - install -Dm644 flatpak/com.leonardschwier.leotheca.desktop /app/share/applications/com.leonardschwier.leotheca.desktop
      - install -Dm644 flatpak/com.leonardschwier.leotheca.metainfo.xml /app/share/metainfo/com.leonardschwier.leotheca.metainfo.xml
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.leonardschwier.leotheca.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/com.leonardschwier.leotheca.png
    sources:
      - type: dir
        path: ..
      # Generated by flatpak-node-generator/flatpak-cargo-generator, see
      # flatpak/README.md for how to regenerate them after a dependency
      # change (package-lock.json or Cargo.lock).
      - node-sources.json
      - cargo-sources.json
