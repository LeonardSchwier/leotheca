id: com.leonardschwier.leotheca
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node20
command: leotheca

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node20/bin
  env:
    CARGO_HOME: /run/build/leotheca/cargo
    npm_config_offline: "true"
    npm_config_cache: /run/build/leotheca/flatpak-node/npm-cache
    ESBUILD_BINARY_PATH: /run/build/leotheca/flatpak-node/cache/esbuild/bin/esbuild-current

modules:
  - name: leotheca
    buildsystem: simple
    build-commands:
      # Points cargo at the vendored crates flatpak-cargo-generator laid
      # out (see cargo-sources.json) instead of crates.io, which the
      # sandboxed build can't reach. Must run before any cargo command.
      - mkdir -p "$CARGO_HOME"
      - cp cargo-config.toml "$CARGO_HOME/config.toml"
      # Offline npm install and Rust dependency fetch, using the
      # pre-generated source lists below, then a Tauri build without its
      # own bundling step (Flatpak does the bundling here instead).
      #
      # `npm ci --offline`, deliberately not `npm install --offline` (session
      # 57 briefly tried the latter and it was the wrong fix, see
      # ROADMAP.md/agent-log/CHANGELOG.md for the full story): `npm ci`
      # trusts package-lock.json's already-resolved versions/URLs completely
      # and never queries the registry for semver-range resolution, so it
      # only ever needs the tarball fetches flatpak-node-generator's
      # node-sources.json actually provides cache entries for. `npm install`
      # re-resolves from package.json's ranges, which (confirmed by reading
      # flatpak_node_generator/providers/npm.py directly) needs a separate
      # kind of cache entry, one per bare package-metadata registry lookup,
      # e.g. registry.npmjs.org/eslint with no version, that the generator
      # does not produce at all. This project's eslint peer-dependency
      # conflicts (see the ERESOLVE warnings in any `npm install` output)
      # are exactly the kind of situation that forces `npm install` to hit
      # the registry for real, which is why `eslint` specifically was the
      # one that failed first.
      - npm ci --offline
      - cargo --offline fetch --manifest-path src-tauri/Cargo.toml
      - npm run build
      - cargo build --release --manifest-path src-tauri/Cargo.toml --offline
      - install -Dm755 src-tauri/target/release/leotheca /app/bin/leotheca
      - install -Dm644 com.leonardschwier.leotheca.desktop /app/share/applications/com.leonardschwier.leotheca.desktop
      - install -Dm644 com.leonardschwier.leotheca.metainfo.xml /app/share/metainfo/com.leonardschwier.leotheca.metainfo.xml
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.leonardschwier.leotheca.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/com.leonardschwier.leotheca.png
    sources:
      # New submissions must build from a stable, reproducibly pinned source
      # instead of depending on this repository's checkout being present.
      #
      # 2026-09-01: re-pinned off the old `v1.0.0` tag, which predates both
      # the F-015 version-scheme correction (VERSION is now 0.1.0, no
      # `v0.1.0` tag exists yet) and commit 6f58e52's removal of the unused
      # `eslint-plugin-preact` dependency. That tag's package-lock.json still
      # pulls in `eslint-plugin-preact`'s transitive `eslint-plugin-compat`,
      # whose peer-dependency override forces `npm ci --offline` to hit the
      # real registry for a bare `eslint` metadata lookup, one node-sources.json
      # (already regenerated against the current, already-fixed lockfile) has
      # no offline cache entry for. Real failure confirmed via CI logs
      # (`ENOTCACHED ... registry.npmjs.org/eslint`), not guessed. Pinned to a
      # plain commit hash instead of a tag since no stable release tag exists
      # yet; move this to a real `v0.1.0`-style tag once one is cut. Whoever
      # regenerates node-sources.json/cargo-sources.json for a lockfile change
      # must update this commit to the same one those were regenerated against.
      - type: git
        url: https://github.com/LeonardSchwier/leotheca.git
        commit: eb98b1affd309207d7fb114f1e8d6e9acf45537b
      # Keep submission metadata alongside the manifest so the same files
      # can be copied to the external submission repository unchanged.
      - type: file
        path: cargo-config.toml
      - type: file
        path: com.leonardschwier.leotheca.desktop
      - type: file
        path: com.leonardschwier.leotheca.metainfo.xml
      # Generated by flatpak-node-generator/flatpak-cargo-generator, see
      # flatpak/README.md for how to regenerate them after a dependency
      # change (package-lock.json or Cargo.lock).
      - node-sources.json
      - cargo-sources.json
