name: leotheca
summary: "Local markdown viewer and editor - no account, no telemetry, no sync"
description: |
  Leotheca is a free and open source markdown viewer and editor for a
  local folder of notes. No account, no telemetry, no sync. Works with
  any folder of .md files. Supports math, mermaid diagrams, PDFs, CSV,
  and images. Built with Tauri (Rust + Preact).

base: core24
confinement: strict
grade: stable
version: "1.0.0"
icon: assets/icons/leotheca.svg
apps:
  leotheca:
    command: usr/bin/leotheca
    plugs:
      - home
      - desktop
      - x11
      - wayland
      - desktop-legacy
      - unity7
    desktop: leotheca.desktop
slots:
  desktop:
    extensions: [core24]
parts:
  leotheca:
    plugin: nil
    source: .
    build-attributes: [no-patchelf, no-parallel]
    override-build: |
      # Install Rust toolchain
      rustup toolchain install stable --profile minimal
      rustup default stable

      # Install Node.js from a pinned release archive, verified by SHA-256
      # (same release and hashes as packaging/f-droid; no piped installer).
      NODE_VERSION=v22.23.2
      case "$(dpkg --print-architecture)" in
        amd64)
          NODE_ARCH=x64
          NODE_SHA256=d60acfe00a2932254bb0ad20e01b0d74397a0875595de719654b214f4b03f307
          ;;
        arm64)
          NODE_ARCH=arm64
          NODE_SHA256=fff4078c5def658577f92c88db7db3bc0072924bfb93fe52c1e744a54e94abb8
          ;;
        *)
          echo "unsupported architecture for the pinned Node.js archive" >&2
          exit 1
          ;;
      esac
      NODE_TARBALL="node-$NODE_VERSION-linux-$NODE_ARCH.tar.xz"
      curl -fsSLo "/tmp/$NODE_TARBALL" "https://nodejs.org/download/release/$NODE_VERSION/$NODE_TARBALL"
      echo "$NODE_SHA256  /tmp/$NODE_TARBALL" | sha256sum -c -
      mkdir -p "$SNAPCRAFT_PART_BUILD/node"
      tar -xJf "/tmp/$NODE_TARBALL" -C "$SNAPCRAFT_PART_BUILD/node" --strip-components=1
      export PATH="$SNAPCRAFT_PART_BUILD/node/bin:$PATH"

      # Build Tauri app
      cd src-tauri
      cargo build --release

      # Copy binary
      install -Dm755 target/release/leotheca $CRAFT_PART_INSTALL/usr/bin/leotheca
      # Copy desktop file
      install -Dm644 $CRAFT_PART_SRC/flatpak/com.leonardschwier.leotheca.desktop $CRAFT_PART_INSTALL/usr/share/applications/leotheca.desktop
      # Copy icons
      mkdir -p $CRAFT_PART_INSTALL/usr/share/icons/hicolor/128x128/apps/
      install -Dm644 $CRAFT_PART_SRC/assets/icons/leotheca.svg $CRAFT_PART_INSTALL/usr/share/icons/hicolor/128x128/apps/leotheca.svg
    prime:
      - -usr/lib/rustlib/**
    organize:
      src-tauri/target/release/leotheca: usr/bin/leotheca
