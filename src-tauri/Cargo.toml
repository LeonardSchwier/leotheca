[package]
name = "leotheca"
version = "0.1.0"
description = "A free and open source markdown viewer and editor."
authors = ["Leotheca contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "leotheca_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
# Flatpak sandboxes cannot use the GTK file chooser directly. The portal
# backend preserves user-selected workspace access without broad host access.
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-fs = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
