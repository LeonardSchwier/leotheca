[package]
name = "leotheca"
version = "1.0.0"
description = "A free and open source markdown viewer and editor."
authors = ["Leotheca contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "leotheca_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
# Flatpak sandboxes cannot use the GTK file chooser directly. The portal
# backend preserves user-selected workspace access without broad host access.
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-fs = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only Url::to_file_path() below (macOS file-association opens deliver a
# file:// URL via RunEvent::Opened, not a CLI argument) needs this
# directly; every other platform already pulls it in transitively via
# `tauri` itself.
url = "2"

# Local whisper.cpp FFI bindings for speech recognition
# If whisper.cpp source is available, it will be compiled and used;
# otherwise stub implementations are used
whisper-ffi = { path = "native/whisper" }

[dev-dependencies]
# "test" feature only: enables tauri::test::mock_builder for
# set_active_workspace_root's asset-protocol-scope test (commands.rs),
# which needs a real App/AppHandle to call app.asset_protocol_scope() on.
# Cargo unifies this with the plain `tauri` dependency above for test
# builds, so it never reaches a release binary.
tauri = { version = "2", features = ["test"] }

[features]
default = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
